<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007a3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Obaveze"><link rel="manifest" href="manifest.json?v=20260829-2"><link rel="apple-touch-icon" href="icon-192.png?v=20260829-2"><title>Obaveze</title>
<style>
:root{
  --bg:#f5f7f6;
  --paper:#ffffff;
  --paper-soft:#fafbfa;
  --ink:#17201b;
  --text:#253029;
  --mute:#7b8680;
  --line:#e0e6e2;
  --green:#007a3d;
  --green-deep:#006b35;
  --green-soft:#eaf5ef;
  --amber:#e09a18;
  --amber-soft:#fff5df;
  --red:#d94f55;
  --red-soft:#fff0f1;
  --shadow:0 7px 22px rgba(27,54,40,.08);
  --shadow-soft:0 3px 12px rgba(27,54,40,.06);
  --radius:18px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:0 16px 110px}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.sm{font-size:13px}
.xs{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:800}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.hot{color:var(--red)}
.amber{color:var(--amber)}
.green{color:var(--green)}

/* ===== Exact approved dashboard direction ===== */
.dashboardHero{
  margin:0 -16px 14px;
  padding:13px 18px 14px;
  min-height:0;
  background:linear-gradient(145deg,#008348 0%,#006f39 56%,#006130 100%);
  color:#fff;
  border-radius:0 0 18px 18px;
  box-shadow:0 6px 20px rgba(0,92,47,.14);
}
.heroTop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logoPlate{
  width:146px;height:47px;
  background:#fff;
  border-radius:9px;
  padding:5px 8px;
  display:flex;align-items:center;
  box-shadow:0 2px 9px rgba(0,0,0,.08);
}
.logoPlate img{display:block;width:100%;height:100%;object-fit:contain}
.menuCircle{
  width:40px;height:40px;border-radius:11px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);
  color:#fff;display:grid;place-items:center;
  font-size:22px;line-height:1;
}
.heroBody{
  display:grid;
  grid-template-columns:minmax(0,1fr) 88px;
  gap:12px;
  align-items:center;
  margin-top:12px;
}
.greeting{font-size:21px;line-height:1.08;font-weight:500;letter-spacing:-.02em}
.greeting b{font-weight:800}
.heroSub{margin-top:5px;font-size:13px;color:rgba(255,255,255,.84)}
.priorityCard{
  min-height:72px;
  border-radius:12px;
  padding:9px 7px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.10);
  text-align:center;
  display:flex;flex-direction:column;justify-content:center;
}
.priorityLabel{font-size:10px;color:rgba(255,255,255,.9)}
.priorityLabel .star{color:#ffc43d;margin-right:4px}
.priorityNumber{font-size:25px;font-weight:800;line-height:1;margin:4px 0 2px}
.priorityFoot{font-size:10px;color:rgba(255,255,255,.82)}

.dashboardKpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin-bottom:13px;
}
.summaryTile{
  min-width:0;
  min-height:88px;
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  padding:8px 5px 7px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.summaryIcon{width:22px;height:22px;color:var(--green);margin-bottom:4px}
.summaryIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.summaryTitle{font-size:10px;line-height:1.1;color:#1f2823;min-height:22px;display:flex;align-items:center;justify-content:center}
.summaryValue{font-size:23px;line-height:1;font-weight:800;color:var(--green-deep);margin:4px 0 3px}
.summaryFoot{font-size:9px;color:var(--green-deep);line-height:1.1}
.summaryTile.due .summaryFoot{color:var(--amber)}
.summaryTile.zero{opacity:.53}
.summaryTile.zero .summaryValue{color:#8f9993}

.sectionHead{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin:13px 2px 7px;
}
.sectionHead h2{font-size:16px;letter-spacing:-.01em}
.sectionLink{
  color:var(--green-deep);font-size:13px;font-weight:700;
  border:0;background:none;padding:4px 0;
}
.sectionCard{
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}
.todayRow,.upcomingRow{
  position:relative;
  display:grid;
  align-items:center;
  min-width:0;
}
.todayRow{
  grid-template-columns:34px minmax(0,1fr) auto 24px;
  gap:10px;
  padding:12px 14px 12px 16px;
  min-height:68px;
}
.todayRow+.todayRow,.upcomingRow+.upcomingRow{border-top:1px solid var(--line)}
.todayRow:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green);
}
.todayRow.soon:before{background:var(--amber)}
.todayRow.late:before{background:var(--red)}
.checkBox{
  width:24px;height:24px;border:1.7px solid #9aa49e;border-radius:6px;
  background:#fff;
}
.rowTitle{font-size:14px;font-weight:750;line-height:1.22;overflow-wrap:anywhere}
.rowMeta{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.25}
.rowDue{font-size:11px;font-weight:700;color:var(--red);white-space:nowrap}
.starBtn{font-size:19px;color:#858f89;border:0;background:transparent;padding:0}
.upcomingRow{
  grid-template-columns:54px minmax(0,1fr) 27px;
  gap:11px;padding:11px 14px;min-height:66px;
}
.dateBox{border-right:1px solid var(--line);padding-right:10px;text-align:center}
.dateDay{font-size:21px;line-height:1;font-weight:800;color:var(--green-deep)}
.dateMonth{font-size:10px;text-transform:uppercase;color:var(--mute);margin-top:4px;font-weight:700}
.typeIcon{width:24px;height:24px;color:var(--green);display:grid;place-items:center}
.typeIcon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dashboardEmpty{padding:17px;text-align:center;color:var(--mute);font-size:13px}

/* Other screens, same visual language */
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin:0 -16px 16px;padding:15px 17px 16px;
  background:#fff;border-bottom:1px solid var(--line);
}
.top h1{font-size:24px;letter-spacing:-.02em}
.top .sm{margin-top:3px}
.top .btn{width:44px;height:44px;padding:0;display:grid;place-items:center}
.card{
  background:#fff;border:1px solid #edf0ee;border-radius:16px;
  padding:15px;margin-bottom:10px;box-shadow:var(--shadow-soft);min-width:0;
}
.tight{padding:13px}
.list{display:flex;flex-direction:column;gap:9px}
.list>.card{margin-bottom:0}
.taskTitle{font-size:15px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;
  min-height:28px;padding:5px 10px;border-radius:999px;
  background:#f3f5f4;border:1px solid #e2e7e4;
  color:#68736d;font-size:12px;line-height:1.1;
}
.chip.person{background:var(--green-soft);border-color:#d1e9dc;color:var(--green-deep)}
.chip.priority.strategic{background:var(--amber-soft);border-color:#f1d69c;color:#976310}
.chip.date{background:#f6f7f6;color:#6b756f}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;
}
.btn.pri,.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:750}
.btn.danger,.danger{color:var(--red)}
.btnrow{display:flex;gap:8px}.btnrow .grow{flex:1}
.tabs{display:flex;gap:7px;overflow:auto;margin:0 0 12px;padding-bottom:2px}
.tabs .btn{white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.kpi{background:#fff;border:1px solid #edf0ee;border-radius:15px;padding:12px;box-shadow:var(--shadow-soft)}
.kpi .num{font-size:27px;margin-top:3px}
.kpi.zero{opacity:.55}
.f{display:block;margin-bottom:11px}.f span{display:block;margin-bottom:5px}
input,select,textarea{
  width:100%;background:#fff;border:1px solid #dce3df;border-radius:11px;padding:11px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,122,61,.10)}
textarea{min-height:96px;resize:vertical}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Dialogs */
dialog{border:0;background:transparent;padding:0;width:min(680px,calc(100% - 20px));color:var(--ink)}
dialog::backdrop{background:rgba(12,24,17,.38);backdrop-filter:blur(2px)}
.sheet{
  background:var(--bg);border:1px solid var(--line);border-radius:21px;
  padding:16px;max-height:88vh;overflow:auto;box-shadow:0 18px 55px rgba(14,34,22,.19);
}

/* FAB */
.fab{
  position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:82px;
  width:60px;height:60px;border-radius:50%;border:5px solid var(--bg);
  background:linear-gradient(145deg,#00864a,#006f39);color:#fff;font-size:31px;
  box-shadow:0 9px 28px rgba(0,111,57,.28);z-index:20;
}

/* Bottom navigation */
nav{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);backdrop-filter:blur(16px);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:19;
}
nav .inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr)}
nav button{
  min-height:72px;background:none;border:0;color:#7f8983;padding:9px 2px 7px;
  font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;
}
.navIcon{width:25px;height:25px}
.navIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--green-deep)}
nav button.on:after{
  content:"";position:absolute;bottom:4px;left:29%;right:29%;height:3px;border-radius:3px;background:var(--green);
}

/* Safety */
.card,.row,.grow,.taskTitle,label,summary{min-width:0}
.card b,.card .sm,.card .xs,.taskTitle,label,summary{overflow-wrap:anywhere}
@media(max-width:380px){
  .dashboardHero{padding-left:16px;padding-right:16px}
  .logoPlate{width:138px;height:46px}
  .heroBody{grid-template-columns:minmax(0,1fr) 86px}
  .dashboardKpis{gap:6px}
  .summaryTile{padding-left:4px;padding-right:4px}
  .summaryTitle{font-size:11px}
}
</style></head><body><main class="app"><div id="view"></div></main>
<button class="fab" id="fab">+</button>
<nav><div class="inner coreNav">
<button data-nav="pregled"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span>Pregled</span></button>
<button data-nav="akcije"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span><span>Akcije</span></button>
<button data-nav="projekti"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l1.8 2h9.2v9.5a2 2 0 0 1-2 2h-15z"/><path d="M3.5 7.5V5a2 2 0 0 1 2-2h4l1.8 2h7.2a2 2 0 0 1 2 2v2.5"/></svg></span><span>Projekti</span></button>
<button data-nav="beleske"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 20V5A1.5 1.5 0 0 1 6.5 3.5z"/><path d="M14.5 3.5V7h3.5M8 11h7M8 15h7"/></svg></span><span>Beleške</span></button>
</div></nav><dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<script>
const KEY="obaveze_app_v1";
const IMPORTED=[];
const $=q=>document.querySelector(q), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const iso=d=>new Date(d).toISOString().slice(0,10), today=()=>iso(new Date());
function fmtDate(d){
 if(!d)return "";
 const [y,m,da]=String(d).split("-");
 return y&&m&&da?`${da}.${m}.${y}.`:d;
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){S={items:IMPORTED,people:[],weeklyReviews:[],lastId:0};}
function norm(){
 S.items=S.items||[];
 S.items.forEach(x=>{
  x.ID=Number(x.ID)||++S.lastId; S.lastId=Math.max(S.lastId,x.ID);
  if(x.Tip==="Akcija"){if(x.Status==="Novo"||x.Status==="U toku")x.Status="Otvoreno";if(x.Status==="Čeka")x.Status="Čeka drugog"}
 });
 S.items.filter(x=>x.Tip==="Projekat").forEach(x=>{if(!x.Status)x.Status="Aktivan"});
 if(!Array.isArray(S.weeklyReviews))S.weeklyReviews=[];
 S.people=[...new Set(S.items.map(x=>x.Odgovoran).filter(Boolean))].sort();
 save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

function isStandalone(){
 return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}

function daysSince(d){
 if(!d)return 99999;
 return Math.floor((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/86400000);
}
function backupDue(){return !S._lastBackup || daysSince(S._lastBackup)>=14}
function reviewHistoryFor(id){
 return (S.weeklyReviews||[]).flatMap(r=>(r.items||[]).filter(x=>x.id===id));
}
function unchangedReviewStreak(id){
 const h=reviewHistoryFor(id).slice().reverse();
 let n=0;
 for(const x of h){if(x.action==="keep")n++;else break}
 return n;
}

function activeActions(){return S.items.filter(x=>x.Tip==="Akcija"&&x.Status!=="Završeno")}
function projects(){return S.items.filter(x=>x.Tip==="Projekat"&&x.Status!=="Završen")}
function notes(){return S.items.filter(x=>x.Tip==="Beleška")}
function projectName(x){return x.Projekat||""}
function actionsForProject(p){
 const name=p.Projekat||p.Zadatak||"";
 return activeActions().filter(x=>x.Projekat===name||Number(x["Nadovezuje se na ID"])===Number(p.ID));
}
function daysTo(d){if(!d)return 99999;return Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function greeting(){
 const h=new Date().getHours();
 return h<11?"Dobro jutro":h<18?"Dobar dan":"Dobro veče";
}
function monthShort(d){
 if(!d)return "";
 const m=["JAN","FEB","MAR","APR","MAJ","JUN","JUL","AVG","SEP","OKT","NOV","DEC"];
 const dt=new Date(d+"T00:00:00"); return m[dt.getMonth()];
}
const ICONS={
 action:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>`,
 project:`<svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.8 2h9.2v9.5a2 2 0 0 1-2 2h-15z"/><path d="M3.5 7.5V5a2 2 0 0 1 2-2h4l1.8 2h7.2a2 2 0 0 1 2 2v2.5"/></svg>`,
 note:`<svg viewBox="0 0 24 24"><path d="M6 3.5h9l3 3V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 20V5A1.5 1.5 0 0 1 6.5 3.5z"/><path d="M14.5 3.5V7h3.5M8 11h7M8 15h7"/></svg>`,
 calendar:`<svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M8 3v5M16 3v5M4 10h16"/></svg>`
};
function attentionSort(a,b){
 const score=x=>{let s=0,d=daysTo(x.Rok);if(d<0)s+=1000;if(x.Prioritet==="Strateško")s+=500;if(d>=0&&d<=7)s+=300;if(x.Status==="Čeka drugog")s+=100;if(!x.Rok)s+=20;return -s};
 return score(a)-score(b);
}
function taskCard(x){
 const d=daysTo(x.Rok);
 const stripe=d<0?"var(--red)":d<=7?"var(--amber)":"#c0c8c3";
 const priClass=x.Prioritet==="Strateško"?"priority strategic":"priority";
 return `<div class="card tight" data-item="${x.ID}" style="border-left:4px solid ${stripe}">
  <div class="taskTitle">${esc(x.Zadatak)}</div>
  <div class="meta">
   ${x.Odgovoran?`<span class="chip person">${esc(x.Odgovoran)}</span>`:""}
   ${x.Prioritet?`<span class="chip ${priClass}">${esc(x.Prioritet)}</span>`:""}
   ${x.Projekat?`<span class="chip">${esc(x.Projekat)}</span>`:""}
   ${x.Rok?`<span class="chip date">${esc(fmtDate(x.Rok))}</span>`:""}
   ${unchangedReviewStreak(x.ID)>=3?`<span class="chip priority strategic">${unchangedReviewStreak(x.ID)} pregleda bez promjene</span>`:""}
  </div>
 </div>`;
}
let route="pregled";
function render(){
 document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("on",b.dataset.nav===route));
 ({pregled:vPregled,akcije:vAkcije,projekti:vProjekti,beleske:vBeleske}[route]||vPregled)();
 bindCards(); bindMenu();
}
function head(title,sub=""){
 return `<div class="top"><div><h1>${esc(title)}</h1>${sub?`<div class="sm mute">${esc(sub)}</div>`:""}</div><button class="btn" id="menuBtn" aria-label="Meni">☰</button></div>`;
}
function vPregled(){
 const actions=activeActions();
 const ps=projects();
 const ns=notes();
 const dueToday=actions.filter(x=>x.Rok===today());
 const strategic=actions.filter(x=>x.Prioritet==="Strateško");
 const upcoming=actions.filter(x=>x.Rok&&daysTo(x.Rok)>0).sort((a,b)=>a.Rok.localeCompare(b.Rok)).slice(0,5);
 const todayRows=dueToday.slice().sort(attentionSort);

 const tile=(icon,title,value,foot,extra="")=>`<div class="summaryTile ${value===0?"zero":""} ${extra}">
   <div class="summaryIcon">${icon}</div><div class="summaryTitle">${title}</div>
   <div class="summaryValue">${value}</div><div class="summaryFoot">${foot}</div></div>`;

 const todayHTML=todayRows.length?todayRows.map(x=>{
   const d=daysTo(x.Rok),cls=d<0?"late":d<=1?"soon":"";
   return `<div class="todayRow ${cls}" data-item="${x.ID}">
     <button class="checkBox" data-done="${x.ID}" aria-label="Označi kao završeno"></button>
     <div><div class="rowTitle">${esc(x.Zadatak)}</div><div class="rowMeta">${esc(x.Izvor||x.Projekat||x.Sistem||"Akcija")}${x.Prioritet?` · ${esc(x.Prioritet)}`:""}</div></div>
     <div class="rowDue">Danas</div><span class="starMark ${x.Prioritet==="Strateško"?"strategic":""}" aria-label="${x.Prioritet==="Strateško"?"Strateško":""}">${x.Prioritet==="Strateško"?"★":""}</span>
   </div>`;
 }).join(""):`<div class="dashboardEmpty">Nema akcija sa rokom danas.</div>`;

 const upcomingHTML=upcoming.length?upcoming.map(x=>{
   const [y,m,d]=x.Rok.split("-");
   return `<div class="upcomingRow" data-item="${x.ID}">
    <div class="dateBox"><div class="dateDay">${d}</div><div class="dateMonth">${monthShort(x.Rok)}</div></div>
    <div><div class="rowTitle">${esc(x.Zadatak)}</div><div class="rowMeta">${esc(x.Projekat||x.Izvor||"Akcija")} · Rok: ${esc(fmtDate(x.Rok))}</div></div>
    <div class="typeIcon">${ICONS.action}</div>
   </div>`;
 }).join(""):`<div class="dashboardEmpty">Nema narednih rokova.</div>`;

 $("#view").innerHTML=`<section class="dashboardHero">
  <div class="heroTop">
   <div class="logoPlate"><img src="https://www.grawe.at/fileadmin/shared/Logos/Logo_GRAWE_2021_RGB.jpg" alt="GRAWE"></div>
   <button class="menuCircle" id="menuBtn" aria-label="Meni">☰</button>
  </div>

function weeklyReview(){
 const a=activeActions().slice().sort(attentionSort);
 let i=0;
 const result={date:today(),closed:0,moved:0,waiting:0,kept:0,items:[]};

 const record=(x,action)=>result.items.push({id:x.ID,action});

 const finishReview=()=>{
   S.weeklyReviews.push(result);save();
   openDlg(`<h2>Nedeljni pregled završen</h2>
   <div class="kpis" style="margin-top:12px">
    <div class="kpi"><div class="xs">Završeno</div><div class="num">${result.closed}</div></div>
    <div class="kpi"><div class="xs">Pomjeren rok</div><div class="num">${result.moved}</div></div>
    <div class="kpi"><div class="xs">Čeka drugog</div><div class="num">${result.waiting}</div></div>
    <div class="kpi"><div class="xs">Ostavljeno</div><div class="num">${result.kept}</div></div>
   </div>
   <button class="btn pri" style="width:100%" id="wrDone">Zatvori</button>`);
   $("#wrDone").onclick=()=>{closeDlg();render()};
 };

 const show=()=>{
  if(i>=a.length)return finishReview();
  const x=a[i],streak=unchangedReviewStreak(x.ID);
  openDlg(`<div class="xs">Nedeljni pregled · ${i+1}/${a.length}</div>
   <h2 style="margin-top:7px">${esc(x.Zadatak)}</h2>
   <div class="meta">${x.Projekat?`<span class="chip">${esc(x.Projekat)}</span>`:""}${x.Odgovoran?`<span class="chip person">${esc(x.Odgovoran)}</span>`:""}${x.Rok?`<span class="chip date">${esc(fmtDate(x.Rok))}</span>`:""}${streak>=2?`<span class="chip priority strategic">${streak} pregleda bez promjene</span>`:""}</div>
   <div class="btnrow" style="margin-top:16px"><button class="btn grow" id="keep">Ostavi</button><button class="btn grow" id="wait">Čeka drugog</button></div>
   <div class="btnrow" style="margin-top:8px"><button class="btn grow" id="date">Promijeni rok</button><button class="btn pri grow" id="finish">Završi</button></div>`);

  $("#keep").onclick=()=>{result.kept++;record(x,"keep");i++;show()};
  $("#wait").onclick=()=>{x.Status="Čeka drugog";result.waiting++;record(x,"wait");save();i++;show()};
  $("#finish").onclick=()=>{x.Status="Završeno";result.closed++;record(x,"finish");save();i++;show()};
  $("#date").onclick=()=>{
    const d=prompt("Novi rok (GGGG-MM-DD)",x.Rok||today());
    if(d){x.Rok=d;result.moved++;record(x,"move");save()}else{result.kept++;record(x,"keep")}
    i++;show()
  };
 };
 show();
}

function importData(){
 const input=document.createElement("input");input.type="file";input.accept="application/json,.json";
 input.onchange=()=>{
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
   try{
    const data=JSON.parse(String(r.result||""));
    if(!data||!Array.isArray(data.items))throw new Error("format");
    openDlg(`<h2>Vrati backup?</h2><p class="mute" style="margin:10px 0 16px">Trenutni lokalni podaci biće zamijenjeni sadržajem iz <b>${esc(f.name)}</b>.</p><div class="btnrow"><button class="btn danger grow" id="importYes">Vrati backup</button><button class="btn grow" id="importNo">Otkaži</button></div>`);
    $("#importNo").onclick=closeDlg;
    $("#importYes").onclick=()=>{S=data;if(!Array.isArray(S.weeklyReviews))S.weeklyReviews=[];S.lastId=Number(S.lastId)||0;norm();closeDlg();render()};
   }catch(e){openDlg(`<h2>Backup nije učitan</h2><p class="mute" style="margin:10px 0 16px">Izabrani fajl nije prepoznat kao važeći backup aplikacije Obaveze.</p><button class="btn pri" style="width:100%" id="importErrClose">Zatvori</button>`);$("#importErrClose").onclick=closeDlg}
  };
  r.readAsText(f);
 };
 input.click();
}
