<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007a3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Obaveze"><link rel="manifest" href="manifest.json?v=20260904-53"><link rel="apple-touch-icon" href="icon-192.png?v=20260904-53"><title>Obaveze</title>
<style>
:root{
  --bg:#f5f7f6;
  --paper:#ffffff;
  --paper-soft:#fafbfa;
  --ink:#17201b;
  --text:#253029;
  --mute:#7b8680;
  --line:#e0e6e2;
  --green:#007a3d;
  --green-deep:#006b35;
  --green-soft:#eaf5ef;
  --amber:#e09a18;
  --amber-soft:#fff5df;
  --red:#d94f55;
  --red-soft:#fff0f1;
  --shadow:0 7px 22px rgba(27,54,40,.08);
  --shadow-soft:0 3px 12px rgba(27,54,40,.06);
  --radius:18px;
  --muted:var(--mute);
  --card:var(--paper);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:0 16px 110px}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.sm{font-size:13px}
.xs{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:800}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.hot{color:var(--red)}
.amber{color:var(--amber)}
.green{color:var(--green)}

/* ===== Exact approved dashboard direction ===== */
.dashboardHero{
  margin:0 -16px 14px;
  padding:13px 18px 14px;
  min-height:0;
  background:linear-gradient(145deg,#008348 0%,#006f39 56%,#006130 100%);
  color:#fff;
  border-radius:0 0 18px 18px;
  box-shadow:0 6px 20px rgba(0,92,47,.14);
}
.heroTop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logoPlate{
  width:146px;height:47px;
  background:#fff;
  border-radius:9px;
  padding:5px 8px;
  display:flex;align-items:center;
  box-shadow:0 2px 9px rgba(0,0,0,.08);
}
.logoPlate img{display:block;width:100%;height:100%;object-fit:contain}
.menuCircle{
  width:40px;height:40px;border-radius:11px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);
  color:#fff;display:grid;place-items:center;
  font-size:22px;line-height:1;
}
.heroBody{
  display:grid;
  grid-template-columns:minmax(0,1fr) 88px;
  gap:12px;
  align-items:center;
  margin-top:12px;
}
.greeting{font-size:21px;line-height:1.08;font-weight:500;letter-spacing:-.02em}
.greeting b{font-weight:800}
.heroSub{margin-top:5px;font-size:13px;color:rgba(255,255,255,.84)}
.priorityCard{
  min-height:72px;
  border-radius:12px;
  padding:9px 7px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.10);
  text-align:center;
  display:flex;flex-direction:column;justify-content:center;
}
.priorityLabel{font-size:10px;color:rgba(255,255,255,.9)}
.priorityLabel .star{color:#ffc43d;margin-right:4px}
.priorityNumber{font-size:25px;font-weight:800;line-height:1;margin:4px 0 2px}
.priorityFoot{font-size:10px;color:rgba(255,255,255,.82)}

.dashboardKpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin-bottom:13px;
}
.summaryTile{
  min-width:0;
  min-height:88px;
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  padding:8px 5px 7px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.summaryIcon{width:22px;height:22px;color:var(--green);margin-bottom:4px}
.summaryIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.summaryTitle{font-size:10px;line-height:1.1;color:#1f2823;min-height:22px;display:flex;align-items:center;justify-content:center}
.summaryValue{font-size:23px;line-height:1;font-weight:800;color:var(--green-deep);margin:4px 0 3px}
.summaryFoot{font-size:9px;color:var(--green-deep);line-height:1.1}
.summaryTile.due .summaryFoot{color:var(--amber)}
.summaryTile.zero{opacity:.53}
.summaryTile.zero .summaryValue{color:#8f9993}

.sectionHead{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin:13px 2px 7px;
}
.sectionHead h2{font-size:16px;letter-spacing:-.01em}
.sectionLink{
  color:var(--green-deep);font-size:13px;font-weight:700;
  border:0;background:none;padding:4px 0;
}
.sectionCard{
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}
.todayRow,.upcomingRow{
  position:relative;
  display:grid;
  align-items:center;
  min-width:0;
}
.todayRow{
  grid-template-columns:34px minmax(0,1fr) auto 24px;
  gap:10px;
  padding:12px 14px 12px 16px;
  min-height:68px;
}
.todayRow+.todayRow,.upcomingRow+.upcomingRow{border-top:1px solid var(--line)}
.todayRow:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#c4ccc7;
}
.todayRow.soon:before{background:var(--amber)}
.todayRow.late:before{background:var(--red)}
.checkBox,.pendingCircle{
  width:24px;height:24px;border:1.7px solid #9aa49e;border-radius:50%;
  background:#fff;padding:0;
}
.pendingCircle{justify-self:end}
.checkBox:active,.pendingCircle:active{background:#eef2ef}
.rowTitle{font-size:14px;font-weight:750;line-height:1.22;overflow-wrap:anywhere}
.rowMeta{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.25}
.rowDue{font-size:11px;font-weight:700;color:var(--red);white-space:nowrap}
.upcomingRow{
  grid-template-columns:54px minmax(0,1fr) 27px;
  gap:11px;padding:11px 14px;min-height:66px;
}
.dateBox{border-right:1px solid var(--line);padding-right:10px;text-align:center}
.dateDay{font-size:21px;line-height:1;font-weight:800;color:var(--green-deep)}
.dateMonth{font-size:10px;text-transform:uppercase;color:var(--mute);margin-top:4px;font-weight:700}
.typeIcon{width:24px;height:24px;color:var(--green);display:grid;place-items:center}
.typeIcon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dashboardEmpty{padding:17px;text-align:center;color:var(--mute);font-size:13px}

/* Other screens, same visual language */
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin:0 -16px 14px;padding:19px 18px 17px;
  background:linear-gradient(145deg,#008348 0%,#006f39 68%,#006130 100%);
  color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(0,92,47,.12);
}
.top h1{font-size:25px;letter-spacing:-.025em}
.top .sm{margin-top:3px;color:rgba(255,255,255,.78)}
.top .btn{width:42px;height:42px;padding:0;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}
.card{
  background:#fff;border:1px solid #edf0ee;border-radius:16px;
  padding:15px;margin-bottom:10px;box-shadow:var(--shadow-soft);min-width:0;
}
.tight{padding:13px}
.list{display:flex;flex-direction:column;gap:9px}
.list>.card{margin-bottom:0}
.taskTitle{font-size:15px;font-weight:750;line-height:1.28;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;
  min-height:26px;padding:4px 9px;border-radius:999px;
  background:#f3f5f4;border:1px solid #e2e7e4;
  color:#68736d;font-size:11px;line-height:1.1;
}
.chip.person{background:var(--green-soft);border-color:#d1e9dc;color:var(--green-deep)}
.chip.priority.strategic{background:var(--amber-soft);border-color:#f1d69c;color:#976310}
.chip.date{background:#f6f7f6;color:#6b756f}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;
}
.btn.pri,.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:750}
.btn.danger,.danger{color:var(--red)}
.btnrow{display:flex;gap:8px}.btnrow .grow{flex:1}
.tabs{display:flex;gap:6px;overflow:auto;margin:0 -2px 12px;padding:2px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{white-space:nowrap;border-radius:999px;padding:8px 12px;font-size:13px;color:#68736d;background:#fff}
.tabs .btn.on{background:var(--green-soft);border-color:#cfe5d8;color:var(--green-deep);font-weight:750}
.secondaryCard{position:relative;padding:14px 14px 13px 16px;overflow:hidden}
.secondaryCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#c4ccc7}
.secondaryCard.late:before{background:var(--red)}
.secondaryCard.soon:before{background:var(--amber)}
.secondaryCard.strategic:before{background:#c4ccc7}
.secondaryTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.secondaryDue{font-size:11px;font-weight:750;white-space:nowrap;color:var(--mute);padding-top:1px}
.secondaryDue.late{color:var(--red)}
.secondaryDue.soon{color:var(--amber)}
.secondaryMeta{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.3}
.actionOrigin{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--green-soft);border:1px solid #d1e9dc;font-size:12px;line-height:1.35;color:var(--green-deep)}
.actionContext{margin:12px 0 4px;padding:12px;border:1px solid #d1e9dc;border-radius:13px;background:var(--green-soft)}
.actionContextTitle{font-size:12px;font-weight:800;color:var(--green-deep);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.actionContextRow{font-size:13px;line-height:1.45;margin-top:6px}.actionContextRow:first-of-type{margin-top:0}.actionContextRow b{color:var(--green-deep)}
.projectCard,.noteCard{padding:14px}
.projectLead,.noteLead{display:flex;align-items:flex-start;gap:12px}
.secondaryIcon{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--green-soft);color:var(--green-deep);display:grid;place-items:center}
.secondaryIcon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.countBadge{display:inline-flex;align-items:center;justify-content:center;min-width:62px;min-height:27px;padding:4px 8px;border-radius:999px;background:#f2f5f3;color:var(--green-deep);font-size:11px;font-weight:750;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.kpi{background:#fff;border:1px solid #edf0ee;border-radius:15px;padding:12px;box-shadow:var(--shadow-soft)}
.kpi .num{font-size:27px;margin-top:3px}
.kpi.zero{opacity:.55}
.f{display:block;margin-bottom:11px}.f span{display:block;margin-bottom:5px}
input,select,textarea{
  width:100%;background:#fff;border:1px solid #dce3df;border-radius:11px;padding:11px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,122,61,.10)}
textarea{min-height:96px;resize:vertical}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Dialogs */
dialog{border:0;background:transparent;padding:0;width:min(680px,calc(100% - 20px));color:var(--ink)}
dialog::backdrop{background:rgba(12,24,17,.38);backdrop-filter:blur(2px)}
.sheet{
  background:var(--bg);border:1px solid var(--line);border-radius:21px;
  padding:16px;max-height:88vh;overflow:auto;box-shadow:0 18px 55px rgba(14,34,22,.19);
}

/* FAB */
.fab{
  position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:82px;
  width:60px;height:60px;border-radius:50%;border:5px solid var(--bg);
  background:linear-gradient(145deg,#00864a,#006f39);color:#fff;font-size:31px;
  box-shadow:0 9px 28px rgba(0,111,57,.28);z-index:20;
}

/* Bottom navigation */
nav{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);backdrop-filter:blur(16px);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:19;
}
nav .inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr)}
nav button{
  min-height:72px;background:none;border:0;color:#7f8983;padding:9px 2px 7px;
  font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;
}
.navIcon{width:25px;height:25px}
.navIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--green-deep)}
nav button.on:after{
  content:"";position:absolute;bottom:4px;left:29%;right:29%;height:3px;border-radius:3px;background:var(--green);
}

/* Browser / install landing */
.browserLanding{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px 60px}
.browserLandingCard{width:min(520px,100%);background:#fff;border:1px solid #edf0ee;border-radius:22px;box-shadow:var(--shadow);padding:24px 20px;text-align:center}
.browserLandingLogo{width:170px;height:58px;margin:0 auto 20px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}
.browserLandingLogo img{display:block;width:100%;height:100%;object-fit:contain}
.browserLanding h1{font-size:28px;letter-spacing:-.02em;margin-bottom:8px}
.browserLanding p{font-size:15px;line-height:1.5;color:var(--mute);margin:0 auto;max-width:420px}
.browserLanding .localBadge{display:inline-flex;align-items:center;gap:7px;margin:18px 0 16px;padding:8px 12px;border-radius:999px;background:var(--green-soft);color:var(--green-deep);font-size:13px;font-weight:750}
.browserLanding .steps{margin-top:18px;text-align:left;background:var(--paper-soft);border:1px solid var(--line);border-radius:15px;padding:14px 16px;color:var(--text);font-size:14px;line-height:1.5}
.browserLanding .steps b{display:block;margin-bottom:5px}

/* Safety */
.card,.row,.grow,.taskTitle,label,summary{min-width:0}
.card b,.card .sm,.card .xs,.taskTitle,label,summary{overflow-wrap:anywhere}
@media(max-width:380px){
  .dashboardHero{padding-left:16px;padding-right:16px}
  .logoPlate{width:138px;height:46px}
  .heroBody{grid-template-columns:minmax(0,1fr) 86px}
  .dashboardKpis{gap:6px}
  .summaryTile{padding-left:4px;padding-right:4px}
  .summaryTitle{font-size:11px}
}

.filterScroll{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.filterScroll::-webkit-scrollbar{display:none}.filterScroll .btn{flex:0 0 auto}

.filterLabel{margin:12px 0 5px}
.actionSearch{display:flex;align-items:center;gap:8px;margin:10px 0 4px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.actionSearch span{font-size:20px;color:var(--muted)}
.actionSearch input{width:100%;border:0;outline:0;background:transparent;padding:12px 0;font:inherit;color:inherit}
.actionGroup{margin-top:15px}
.actionGroupHead{width:100%;border:0;background:transparent;padding:4px 2px 8px;display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:750;color:inherit;text-align:left}
.actionGroupCount{font-size:13px;color:var(--muted);font-weight:650}
.actionGroupList{margin-top:0}
.projectLate{border-left:4px solid var(--red)}

.projectActionsTitle{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
.projectActionsWrap{margin-top:8px}
.projectActionGroup{margin-top:13px}
.projectActionHead{display:flex;justify-content:space-between;align-items:center;padding:0 2px 6px;font-size:13px;font-weight:750;color:var(--muted)}
.noteInput{min-height:180px}.noteFull{white-space:pre-wrap;font-size:16px;line-height:1.5;margin-top:14px}

.menuSectionLabel{margin:16px 2px 7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.menuItem{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;color:inherit}
.backupNotice{border-left:4px solid var(--amber)}
.personActionGroup,.archiveSection{margin-top:14px}

.meetingCard{cursor:pointer}
.meetingKpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.meetingKpis .kpi{padding:10px 6px}
.meetingKpis .num{font-size:23px}
.meetingAddGrid{display:grid;grid-template-columns: repeat(2,1fr);gap:8px;margin-top:12px}
.meetingAddGrid .btn{padding-left:6px;padding-right:6px}
.meetingGroup{margin-top:12px}
@media(max-width:380px){.meetingKpis{grid-template-columns:repeat(2,1fr)}}


.seriesLink{border:0;background:none;padding:6px 0;color:var(--green-deep);font-weight:750;font-size:13px}
.seriesCard{cursor:pointer}


.meetingTitle{margin-top:5px;font-size:14px;font-weight:750;color:var(--text)}


.starMark{font-weight:700}

.minutesPreview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px}
.minutesPreview .minutesTitle{font-size:22px;font-weight:800;text-align:center;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 4px 12px}
.minutesMetaGrid{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:start;margin:14px 0 18px}
.minutesMetaLabel{font-size:12px;color:var(--mute);font-weight:750;padding-top:9px}
.minutesPreview input,.minutesPreview textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.minutesSection{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.minutesSection h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--green-deep);margin:0 0 7px}
.minutesSection textarea{min-height:92px;line-height:1.45;resize:vertical}
.minutesHint{font-size:12px;color:var(--mute);line-height:1.4;margin-top:8px}
.minutesActions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media(max-width:380px){.minutesMetaGrid{grid-template-columns:1fr;gap:4px}.minutesMetaLabel{padding-top:0}.minutesActions{grid-template-columns:1fr}}


.agendaMeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.agendaConclusion{margin-top:7px;font-size:13px;line-height:1.4;color:var(--text)}
.agendaUnprocessed{border-left:4px solid var(--amber)}
.agendaTransferred{border-left:4px solid var(--green)}
.seriesReview{margin:14px 0 4px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper-soft)}
.seriesReviewGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.seriesReviewStat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center}
.seriesReviewStat b{display:block;font-size:20px}
.seriesReviewList{margin-top:10px}
.seriesReviewItem{padding:9px 10px;border-top:1px solid var(--line);cursor:pointer}
.seriesReviewItem:first-child{border-top:0}
.finishTopic{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.finishTopic:first-child{border-top:0}.finishTopic input{width:auto;margin-top:4px}
.minutesPreview{max-width:680px;margin:12px auto 0}
.minutesHeader{text-align:center;padding-bottom:14px;border-bottom:2px solid var(--green)}
.minutesHeader h2{font-size:23px;margin:0 0 4px}
.minutesHeader .minutesSub{font-size:14px;color:var(--mute);font-weight:650}
.minutesFacts{display:grid;grid-template-columns:105px 1fr;gap:7px 12px;margin-top:14px;text-align:left}
.minutesFactLabel{font-size:12px;color:var(--mute);font-weight:750}
.minutesLocked{background:var(--paper-soft);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.minutesRecord{border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px;background:#fff}
.minutesRecordHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.minutesRecordTitle{font-weight:800;line-height:1.35}
.minutesRecordMeta{font-size:12px;color:var(--mute);margin-top:5px;line-height:1.45}
.minutesRecordText{font-size:13px;line-height:1.5;margin-top:7px;white-space:pre-wrap}
.minutesEdit{border:0;background:none;color:var(--green-deep);font-weight:750;padding:2px 0;white-space:nowrap}
.minutesFreeText{min-height:95px;line-height:1.5;resize:vertical}

 };

function agendaRelatedItems(noteId){

 const items=S.items.filter(x=>(x.Tip==="Akcija"||x.Tip==="Projekat")&&Number(x.AgendaIzvorID)===Number(noteId));

 (S.meetingSeries||[]).filter(s=>s.Tip==="Projektna"&&(Number(s.AgendaIzvorID)===Number(noteId)||Number(note?.PovezaniProjekatID)===Number(s.ID))).forEach(s=>{

 });

}

function seriesReviewData(m){
 if(!m?.SerijaID)return null;
 const ms=seriesMeetings(m.SerijaID).slice().sort((a,b)=>(a.Datum||"").localeCompare(b.Datum||"")||(a.ID||0)-(b.ID||0));
 const idx=ms.findIndex(x=>Number(x.ID)===Number(m.ID));
 const previous=idx>0?ms[idx-1]:ms.filter(x=>(x.Datum||"")<(m.Datum||"")).slice(-1)[0]||null;
 const ids=new Set(ms.map(x=>Number(x.ID)));
 const actions=S.items.filter(x=>x.Tip==="Akcija"&&(Number(x.SerijaID)===Number(m.SerijaID)||ids.has(Number(x.KolegijumID))));
 const previousActions=previous?meetingItems(previous.ID).filter(x=>x.Tip==="Akcija").slice().sort((a,b)=>(a.ID||0)-(b.ID||0)):[];
 const open=actions.filter(x=>x.Status!=="Završeno");
 const late=open.filter(x=>x.Rok&&daysTo(x.Rok)<0).sort(attentionSort);
 const current=open.filter(x=>!(x.Rok&&daysTo(x.Rok)<0)).sort(attentionSort);
 const doneSince=previous?actions.filter(x=>x.Status==="Završeno"&&x.ZavrsenDatum&&x.ZavrsenDatum>=previous.Datum).sort((a,b)=>(b.ZavrsenDatum||"").localeCompare(a.ZavrsenDatum||"")):[];
 return {previous,previousActions,late,open:current,done:doneSince};
}

const dialogNavStack=[];
let dialogNavCurrent=null,dialogNavSeq=0;

function navFrameValid(frame){
 if(!frame||!frame.key)return false;
 const [kind,raw]=String(frame.key).split(":");
 const id=Number(raw);
 if(kind==="meeting"||kind==="minutes"||kind==="meetingNote"||kind==="meetingNotes"||kind==="agendaForm"||kind==="finishMeeting")return !!meetingById(id);
 if(kind==="series")return !!seriesById(id);
 if(kind==="item")return !!S.items.find(x=>Number(x.ID)===id);
 if(kind==="note")return !!S.items.find(x=>Number(x.ID)===id&&x.Tip==="Beleška"&&x.Status!=="Arhivirana");
 if(kind==="project")return !!S.items.find(x=>Number(x.ID)===id&&x.Tip==="Projekat");
 if(kind==="deadline"||kind==="owner"||kind==="agendaOutcome")return !!S.items.find(x=>Number(x.ID)===id);
 if(kind==="meetingForm")return raw==="new"||!!meetingById(id);
 if(kind==="itemForm")return raw==="new"||!!S.items.find(x=>Number(x.ID)===id);
 if(kind==="seriesForm")return raw==="new"||!!seriesById(id);
 return true;
}
function navFindFrame(key){
 if(dialogNavCurrent?.key===key)return -2;
 for(let i=dialogNavStack.length-1;i>=0;i--)if(dialogNavStack[i].key===key)return i;
 return -1;
}
function navTakeCurrentNodes(){
 const body=$("#dlgBody"),nodes=[];
 if(!body)return nodes;
 while(body.firstChild)nodes.push(body.removeChild(body.firstChild));
 return nodes;
}
function navRestoreFrame(frame){
 const body=$("#dlgBody");if(!body)return;
 body.innerHTML="";
 (frame.nodes||[]).forEach(n=>body.appendChild(n));
 body.scrollTop=frame.scrollTop||0;
 frame.nodes=null;
 dialogNavCurrent=frame;
 const d=$("#dlg");if(d&&!d.open)d.showModal();
}
function navOpen(html,key=null,options={}){
 const body=$("#dlgBody"),d=$("#dlg");if(!body||!d)return;
 key=key||`anon:${++dialogNavSeq}`;
 const dedupe=options.dedupe!==false;
 const found=dedupe?navFindFrame(key):-1;
 if(found===-2){
  body.innerHTML=html;
  dialogNavCurrent.refresh=options.refresh||dialogNavCurrent.refresh||null;
  dialogNavCurrent.onResume=options.onResume||dialogNavCurrent.onResume||null;
  if(!d.open)d.showModal();
  return;
 }
 if(found>=0){
  const picked=dialogNavStack[found];
  dialogNavStack.splice(found);
  body.innerHTML=html;
  dialogNavCurrent={...picked,nodes:null,scrollTop:0,refresh:options.refresh||picked.refresh||null,onResume:options.onResume||picked.onResume||null};
  if(!d.open)d.showModal();

 <div class="btnrow" style="margin-top:18px"><button class="btn grow" id="pe">Uredi projekat</button><button class="btn grow" id="pshare">Podijeli</button><button class="btn grow" id="pmove">Pomjeri rok</button><button class="btn grow" id="pf">Završi projekat</button></div>`,
 `project:${id}`,{refresh:()=>projectDialog(id)});
 $("#pc").onclick=navBack;$("#pa").onclick=()=>editItem(null,"Akcija",{Projekat:name,ProjectID:p.ID,Oblast:"Poslovno"});$("#pe").onclick=()=>editItem(p,"Projekat");
 $("#pshare").onclick=()=>shareText("Projekat",itemShareText(p));$("#pmove").onclick=()=>moveDeadlineDialog(p.ID);
 $("#pf").onclick=()=>{const open=projectActions(p);if(open.length){alert(`Projekat ima ${open.length} otvoren${open.length===1?"u akciju":"ih akcija"}. Prvo ih završi.`);return}if(confirm(`Završi projekat "${name}"?`)){p.Status="Završen";save();render();navBack({type:"changed",kind:"Projekat",id:p.ID})}};

function personDialog(name){
 const a=activeActions().filter(x=>x.Odgovoran===name).slice().sort(attentionSort);
 const late=a.filter(x=>daysTo(x.Rok)<0),todayA=a.filter(x=>x.Rok===today()),week=a.filter(x=>daysTo(x.Rok)>=1&&daysTo(x.Rok)<=7),later=a.filter(x=>daysTo(x.Rok)>7);
 const group=(title,arr)=>arr.length?`<div class="personActionGroup"><div class="projectActionHead"><span>${title}</span><span>${arr.length}</span></div><div class="list">${arr.map(taskCard).join("")}</div></div>`:"";
 navOpen(`<div class="row between"><div><h2>${esc(name)}</h2><div class="sm mute">${a.length} otvorenih akcija${a.length===0?` · Nema otvorenih akcija`:""}</div></div><button class="btn" id="oc">×</button></div>
 <button class="btn pri" id="oa" style="margin-top:12px">+ Nova akcija</button><div style="margin-top:12px">${group("Kasni",late)}${group("Danas",todayA)}${group("Dospijeva u narednih 7 dana",week)}${group("Kasnije",later)}${!a.length?`<div class="empty">Nema otvorenih akcija.</div>`:""}</div>`,
 `person:${encodeURIComponent(name)}`,{refresh:()=>personDialog(name)});
 $("#oc").onclick=navBack;$("#oa").onclick=()=>editItem(null,"Akcija",{Odgovoran:name});bindCards($("#dlgBody"));
}
function noteArchiveDialog(id){
 const n=S.items.find(x=>x.ID===id);if(!n)return;
 navOpen(`<div class="row between"><h2>${n.AgendaStavka===true?"Arhivirana tema agende":"Arhivirana beleška"}</h2><button class="btn" id="nac">×</button></div>
 <div class="noteFull">${esc(n.Zadatak)}</div><div class="meta" style="margin-top:10px"><span class="chip">${esc(n.Oblast||"Poslovno")}</span></div>
 <div class="btnrow" style="margin-top:18px"><button class="btn grow" id="noteRestore">Vrati u Beleške</button><button class="btn danger grow" id="noteDeleteArchived">Obriši</button></div>`,`noteArchive:${id}`,{dedupe:false});
 $("#nac").onclick=navBack;
 $("#noteRestore").onclick=()=>{n.Status="Aktivna";save();render();navBack({type:"changed",kind:"Beleška",id:n.ID})};
 $("#noteDeleteArchived").onclick=()=>{if(confirm("Trajno obriši ovu belešku?")){S.items=S.items.filter(x=>x.ID!==n.ID);save();render();navBack({type:"deleted",kind:"Beleška",id:n.ID})}};
}
function projectArchiveDialog(id){
 const p=S.items.find(x=>x.Tip==="Projekat"&&Number(x.ID)===Number(id));if(!p)return;
 const acts=S.items.filter(x=>x.Tip==="Akcija"&&Number(x.ProjectID)===Number(p.ID));
 const name=p.Projekat||p.Zadatak||"Projekat";
 const details=p["Detalji dogovora"]||p.Napomena||"";
 navOpen(`<div class="row between"><div><h2>${esc(name)}</h2><div class="sm mute">Završen projekat</div></div><button class="btn" id="pac">×</button></div>
  ${details?`<div class="noteBox">${esc(details)}</div>`:""}
  <div class="sm mute" style="margin-top:10px">${acts.length} akcija</div>
  <div class="btnrow" style="margin-top:14px"><button class="btn pri grow" id="projectReopen">Vrati u rad</button><button class="btn grow" id="projectArchiveCancel">Otkaži</button></div>`,`projectArchive:${id}`,{dedupe:false});
 $("#pac").onclick=navBack;
 $("#projectArchiveCancel").onclick=navBack;
 $("#projectReopen").onclick=()=>{
  p.Status="Aktivan";
  save();norm();render();navBack({type:"changed",kind:"Projekat",id:p.ID});projectDialog(p.ID);
 };
}

function archiveDialog(){
 const actions=S.items.filter(x=>x.Tip==="Akcija"&&x.Status==="Završeno").slice().sort((a,b)=>(b.ZavrsenDatum||"").localeCompare(a.ZavrsenDatum||"")||(b.ID||0)-(a.ID||0));
 const notesA=S.items.filter(x=>x.Tip==="Beleška"&&x.Status==="Arhivirana").slice().sort((a,b)=>(b.ID||0)-(a.ID||0));
 const meetingsA=(S.meetings||[]).filter(m=>m.Status==="Završen").slice().sort((a,b)=>(b.ZavrsenDatum||b.Datum||"").localeCompare(a.ZavrsenDatum||a.Datum||"")||(b.ID||0)-(a.ID||0));
 const total=actions.length+notesA.length;
 const meetingCard=m=>{
  const ser=m.SerijaID?seriesById(m.SerijaID):null;
  const linked=meetingItems(m.ID),agenda=linked.filter(x=>x.Tip==="Beleška"&&x.AgendaStavka===true).length,acts=linked.filter(x=>x.Tip==="Akcija").length;
  const title=ser?.Naziv||m.Naslov||"Sastanak";
  return `<div class="card tight">
   <div class="row between" style="align-items:flex-start"><div class="grow"><b>${esc(title)}</b><div class="sm mute" style="margin-top:4px">${esc(fmtDate(m.Datum||""))}${m.Naslov&&ser?` · ${esc(m.Naslov)}`:""}</div><div class="meta" style="margin-top:7px"><span class="chip">${agenda} tema</span><span class="chip">${acts} akcija</span>${m.ZavrsenDatum?`<span class="chip">Završen ${esc(fmtDate(m.ZavrsenDatum))}</span>`:""}</div></div></div>
   <div class="btnrow" style="margin-top:10px"><button class="btn grow" data-arch-meeting="${m.ID}">Sastanak</button><button class="btn grow" data-arch-minutes="${m.ID}">Zapisnik</button><button class="btn grow" data-arch-pdf="${m.ID}">PDF</button></div>
  </div>`;
 };
 navOpen(`<div class="row between"><div><h2>Arhiva</h2><div class="sm mute">${total} arhiviranih stavki · ${meetingsA.length} završenih sastanaka</div></div><button class="btn" id="ac">×</button></div>
 ${meetingsA.length?`<div class="archiveSection"><div class="projectActionHead"><span>Sastanci</span><span>${meetingsA.length}</span></div><div class="list">${meetingsA.map(meetingCard).join("")}</div></div>`:""}
 ${actions.length?`<div class="archiveSection"><div class="projectActionHead"><span>Akcije</span><span>${actions.length}</span></div><div class="list">${actions.map(taskCard).join("")}</div></div>`:""}
 ${notesA.length?`<div class="archiveSection"><div class="projectActionHead"><span>Beleške / teme</span><span>${notesA.length}</span></div><div class="list">${notesA.map(n=>`<div class="card tight" data-arch-note="${n.ID}"><b>${esc(n.Zadatak)}</b><div class="sm mute" style="margin-top:4px">${n.AgendaStavka===true?`Agenda${n.KolegijumID&&meetingById(n.KolegijumID)?` · ${esc(meetingLabel(meetingById(n.KolegijumID)))}`:""}`:esc(n.Oblast||"Poslovno")}</div></div>`).join("")}</div></div>`:""}
 ${!total&&!meetingsA.length?`<div class="empty">Arhiva je prazna.</div>`:""}`,`archive`,{refresh:()=>archiveDialog()});
 $("#ac").onclick=navBack;
 bindCards($("#dlgBody"));
 $("#dlgBody").querySelectorAll("[data-arch-note]").forEach(b=>b.onclick=()=>noteArchiveDialog(Number(b.dataset.archNote)));
 $("#dlgBody").querySelectorAll("[data-arch-meeting]").forEach(b=>b.onclick=()=>meetingDialog(Number(b.dataset.archMeeting)));
 $("#dlgBody").querySelectorAll("[data-arch-minutes]").forEach(b=>b.onclick=()=>meetingMinutesDialog(Number(b.dataset.archMinutes)));
 $("#dlgBody").querySelectorAll("[data-arch-pdf]").forEach(b=>b.onclick=()=>{
  const m=meetingById(Number(b.dataset.archPdf));if(!m)return;
  const d=meetingMinutesData(m),saved=m.ZapisnikDraft&&typeof m.ZapisnikDraft==="object"?m.ZapisnikDraft:{};
  const extras={present:saved.present!==undefined?saved.present:d.participants,absent:saved.absent||"",meetingNo:saved.meetingNo!==undefined?saved.meetingNo:(d.meetingNo||""),intro:saved.intro||"",closing:saved.closing||""};
  exportMinutesPDF(d,extras);
 });
}
function exportData(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="obaveze-backup-"+today()+".json";a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);openDlg(`<h2>Backup pokrenut</h2><p class="mute" style="margin:10px 0 16px">Ako je fajl uspješno sačuvan na uređaju, potvrdi ispod. Tek tada će se računati novi rok od 14 dana.</p><div class="btnrow"><button class="btn pri grow" id="backupOk">Fajl je sačuvan</button><button class="btn grow" id="backupNo">Nije sačuvan</button></div>`);$("#backupOk").onclick=()=>{S._lastBackup=today();save();closeDlg()};$("#backupNo").onclick=closeDlg},300);
}
function importData(){
 const input=document.createElement("input");input.type="file";input.accept="application/json,.json";
 input.onchange=()=>{
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
   try{
    const data=JSON.parse(String(r.result||""));
    if(!data||!Array.isArray(data.items))throw new Error("format");
    openDlg(`<h2>Vrati backup?</h2><p class="mute" style="margin:10px 0 16px">Trenutni lokalni podaci biće zamijenjeni sadržajem iz <b>${esc(f.name)}</b>.</p><div class="btnrow"><button class="btn danger grow" id="importYes">Vrati backup</button><button class="btn grow" id="importNo">Otkaži</button></div>`);
    $("#importNo").onclick=closeDlg;
    $("#importYes").onclick=()=>{S=data;S.lastId=Number(S.lastId)||0;norm();closeDlg();render()};
   }catch(e){openDlg(`<h2>Backup nije učitan</h2><p class="mute" style="margin:10px 0 16px">Izabrani fajl nije prepoznat kao važeći backup aplikacije Obaveze.</p><button class="btn pri" style="width:100%" id="importErrClose">Zatvori</button>`);$("#importErrClose").onclick=closeDlg}
  };
  r.readAsText(f);
 };
 input.click();
}
function resetData(){
 openDlg(`<h2>Resetuj sve podatke?</h2><p class="mute" style="margin:10px 0 16px">Ovo trajno briše sve lokalne projekte, akcije, beleške, kolegijume i ostale podatke ove aplikacije na ovom uređaju.</p><div class="btnrow"><button class="btn danger grow" id="resetYes">Obriši sve</button><button class="btn grow" id="resetNo">Otkaži</button></div>`);
 $("#resetNo").onclick=closeDlg;
 $("#resetYes").onclick=()=>{localStorage.removeItem(KEY);S={items:[],people:[],meetings:[],meetingSeries:[],lastId:0,lastMeetingId:0,lastSeriesId:0};save();closeDlg();render()};
}
function bindCards(root=document){
 root.querySelectorAll("[data-item]").forEach(c=>c.onclick=()=>itemDialog(Number(c.dataset.item)));
}
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js?v=20260904-53").then(reg=>{
   reg.update();
   let refreshing=false;
   navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
   });
  }).catch(()=>{});
 });
}
if(isStandalone()){
 document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{route=b.dataset.nav;render()});

 $("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))closeDlg()});
 norm();render();
}else{
 renderBrowserLanding();
}
