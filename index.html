<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007a3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Obaveze"><link rel="manifest" href="manifest.json?v=20260829-2"><link rel="apple-touch-icon" href="icon-192.png?v=20260829-2"><title>Obaveze</title>
<style>
:root{
  --bg:#f5f7f6;
  --paper:#ffffff;
  --paper-soft:#fafbfa;
  --ink:#17201b;
  --text:#253029;
  --mute:#7b8680;
  --line:#e0e6e2;
  --green:#007a3d;
  --green-deep:#006b35;
  --green-soft:#eaf5ef;
  --amber:#e09a18;
  --amber-soft:#fff5df;
  --red:#d94f55;
  --red-soft:#fff0f1;
  --shadow:0 7px 22px rgba(27,54,40,.08);
  --shadow-soft:0 3px 12px rgba(27,54,40,.06);
  --radius:18px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:0 16px 110px}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.sm{font-size:13px}
.xs{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:800}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.hot{color:var(--red)}
.amber{color:var(--amber)}
.green{color:var(--green)}

/* ===== Exact approved dashboard direction ===== */
.dashboardHero{
  margin:0 -16px 14px;
  padding:13px 18px 14px;
  min-height:0;
  background:linear-gradient(145deg,#008348 0%,#006f39 56%,#006130 100%);
  color:#fff;
  border-radius:0 0 18px 18px;
  box-shadow:0 6px 20px rgba(0,92,47,.14);
}
.heroTop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logoPlate{
  width:146px;height:47px;
  background:#fff;
  border-radius:9px;
  padding:5px 8px;
  display:flex;align-items:center;
  box-shadow:0 2px 9px rgba(0,0,0,.08);
}
.logoPlate img{display:block;width:100%;height:100%;object-fit:contain}
.menuCircle{
  width:40px;height:40px;border-radius:11px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);
  color:#fff;display:grid;place-items:center;
  font-size:22px;line-height:1;
}
.heroBody{
  display:grid;
  grid-template-columns:minmax(0,1fr) 88px;
  gap:12px;
  align-items:center;
  margin-top:12px;
}
.greeting{font-size:21px;line-height:1.08;font-weight:500;letter-spacing:-.02em}
.greeting b{font-weight:800}
.heroSub{margin-top:5px;font-size:13px;color:rgba(255,255,255,.84)}
.priorityCard{
  min-height:72px;
  border-radius:12px;
  padding:9px 7px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.10);
  text-align:center;
  display:flex;flex-direction:column;justify-content:center;
}
.priorityLabel{font-size:10px;color:rgba(255,255,255,.9)}
.priorityLabel .star{color:#ffc43d;margin-right:4px}
.priorityNumber{font-size:25px;font-weight:800;line-height:1;margin:4px 0 2px}
.priorityFoot{font-size:10px;color:rgba(255,255,255,.82)}

.dashboardKpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin-bottom:13px;
}
.summaryTile{
  min-width:0;
  min-height:88px;
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  padding:8px 5px 7px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.summaryIcon{width:22px;height:22px;color:var(--green);margin-bottom:4px}
.summaryIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.summaryTitle{font-size:10px;line-height:1.1;color:#1f2823;min-height:22px;display:flex;align-items:center;justify-content:center}
.summaryValue{font-size:23px;line-height:1;font-weight:800;color:var(--green-deep);margin:4px 0 3px}
.summaryFoot{font-size:9px;color:var(--green-deep);line-height:1.1}
.summaryTile.due .summaryFoot{color:var(--amber)}
.summaryTile.zero{opacity:.53}
.summaryTile.zero .summaryValue{color:#8f9993}

.sectionHead{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin:13px 2px 7px;
}
.sectionHead h2{font-size:16px;letter-spacing:-.01em}
.sectionLink{
  color:var(--green-deep);font-size:13px;font-weight:700;
  border:0;background:none;padding:4px 0;
}
.sectionCard{
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}
.todayRow,.upcomingRow{
  position:relative;
  display:grid;
  align-items:center;
  min-width:0;
}
.todayRow{
  grid-template-columns:34px minmax(0,1fr) auto 24px;
  gap:10px;
  padding:12px 14px 12px 16px;
  min-height:68px;
}
.todayRow+.todayRow,.upcomingRow+.upcomingRow{border-top:1px solid var(--line)}
.todayRow:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green);
}
.todayRow.soon:before{background:var(--amber)}
.todayRow.late:before{background:var(--red)}
.checkBox{
  width:24px;height:24px;border:1.7px solid #9aa49e;border-radius:6px;
  background:#fff;
}
.rowTitle{font-size:14px;font-weight:750;line-height:1.22;overflow-wrap:anywhere}
.rowMeta{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.25}
.rowDue{font-size:11px;font-weight:700;color:var(--red);white-space:nowrap}
.starBtn{font-size:19px;color:#858f89;border:0;background:transparent;padding:0}
.upcomingRow{
  grid-template-columns:54px minmax(0,1fr) 27px;
  gap:11px;padding:11px 14px;min-height:66px;
}
.dateBox{border-right:1px solid var(--line);padding-right:10px;text-align:center}
.dateDay{font-size:21px;line-height:1;font-weight:800;color:var(--green-deep)}
.dateMonth{font-size:10px;text-transform:uppercase;color:var(--mute);margin-top:4px;font-weight:700}
.typeIcon{width:24px;height:24px;color:var(--green);display:grid;place-items:center}
.typeIcon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dashboardEmpty{padding:17px;text-align:center;color:var(--mute);font-size:13px}

/* Other screens, same visual language */
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin:0 -16px 14px;padding:19px 18px 17px;
  background:linear-gradient(145deg,#008348 0%,#006f39 68%,#006130 100%);
  color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(0,92,47,.12);
}
.top h1{font-size:25px;letter-spacing:-.025em}
.top .sm{margin-top:3px;color:rgba(255,255,255,.78)}
.top .btn{width:42px;height:42px;padding:0;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}
.card{
  background:#fff;border:1px solid #edf0ee;border-radius:16px;
  padding:15px;margin-bottom:10px;box-shadow:var(--shadow-soft);min-width:0;
}
.tight{padding:13px}
.list{display:flex;flex-direction:column;gap:9px}
.list>.card{margin-bottom:0}
.taskTitle{font-size:15px;font-weight:750;line-height:1.28;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;
  min-height:26px;padding:4px 9px;border-radius:999px;
  background:#f3f5f4;border:1px solid #e2e7e4;
  color:#68736d;font-size:11px;line-height:1.1;
}
.chip.person{background:var(--green-soft);border-color:#d1e9dc;color:var(--green-deep)}
.chip.priority.strategic{background:var(--amber-soft);border-color:#f1d69c;color:#976310}
.chip.date{background:#f6f7f6;color:#6b756f}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;
}
.btn.pri,.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:750}
.btn.danger,.danger{color:var(--red)}
.btnrow{display:flex;gap:8px}.btnrow .grow{flex:1}
.tabs{display:flex;gap:6px;overflow:auto;margin:0 -2px 12px;padding:2px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{white-space:nowrap;border-radius:999px;padding:8px 12px;font-size:13px;color:#68736d;background:#fff}
.tabs .btn.on{background:var(--green-soft);border-color:#cfe5d8;color:var(--green-deep);font-weight:750}
.secondaryCard{position:relative;padding:14px 14px 13px 16px;overflow:hidden}
.secondaryCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#c4ccc7}
.secondaryCard.late:before{background:var(--red)}
.secondaryCard.soon:before{background:var(--amber)}
.secondaryCard.strategic:before{background:var(--green)}
.secondaryTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.secondaryDue{font-size:11px;font-weight:750;white-space:nowrap;color:var(--mute);padding-top:1px}
.secondaryDue.late{color:var(--red)}
.secondaryDue.soon{color:var(--amber)}
.secondaryMeta{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.3}
.projectCard,.noteCard{padding:14px}
.projectLead,.noteLead{display:flex;align-items:flex-start;gap:12px}
.secondaryIcon{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--green-soft);color:var(--green-deep);display:grid;place-items:center}
.secondaryIcon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.countBadge{display:inline-flex;align-items:center;justify-content:center;min-width:62px;min-height:27px;padding:4px 8px;border-radius:999px;background:#f2f5f3;color:var(--green-deep);font-size:11px;font-weight:750;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.kpi{background:#fff;border:1px solid #edf0ee;border-radius:15px;padding:12px;box-shadow:var(--shadow-soft)}
.kpi .num{font-size:27px;margin-top:3px}
.kpi.zero{opacity:.55}
.f{display:block;margin-bottom:11px}.f span{display:block;margin-bottom:5px}
input,select,textarea{
  width:100%;background:#fff;border:1px solid #dce3df;border-radius:11px;padding:11px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,122,61,.10)}
textarea{min-height:96px;resize:vertical}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Dialogs */
dialog{border:0;background:transparent;padding:0;width:min(680px,calc(100% - 20px));color:var(--ink)}
dialog::backdrop{background:rgba(12,24,17,.38);backdrop-filter:blur(2px)}
.sheet{
  background:var(--bg);border:1px solid var(--line);border-radius:21px;
  padding:16px;max-height:88vh;overflow:auto;box-shadow:0 18px 55px rgba(14,34,22,.19);
}

/* FAB */
.fab{
  position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:82px;
  width:60px;height:60px;border-radius:50%;border:5px solid var(--bg);
  background:linear-gradient(145deg,#00864a,#006f39);color:#fff;font-size:31px;
  box-shadow:0 9px 28px rgba(0,111,57,.28);z-index:20;
}

/* Bottom navigation */
nav{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);backdrop-filter:blur(16px);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:19;
}
nav .inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr)}
nav button{
  min-height:72px;background:none;border:0;color:#7f8983;padding:9px 2px 7px;
  font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;
}
.navIcon{width:25px;height:25px}
.navIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--green-deep)}
nav button.on:after{
  content:"";position:absolute;bottom:4px;left:29%;right:29%;height:3px;border-radius:3px;background:var(--green);
}

/* Browser / install landing */
.browserLanding{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px 60px}
.browserLandingCard{width:min(520px,100%);background:#fff;border:1px solid #edf0ee;border-radius:22px;box-shadow:var(--shadow);padding:24px 20px;text-align:center}
.browserLandingLogo{width:170px;height:58px;margin:0 auto 20px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}
.browserLandingLogo img{display:block;width:100%;height:100%;object-fit:contain}
.browserLanding h1{font-size:28px;letter-spacing:-.02em;margin-bottom:8px}
.browserLanding p{font-size:15px;line-height:1.5;color:var(--mute);margin:0 auto;max-width:420px}
.browserLanding .localBadge{display:inline-flex;align-items:center;gap:7px;margin:18px 0 16px;padding:8px 12px;border-radius:999px;background:var(--green-soft);color:var(--green-deep);font-size:13px;font-weight:750}
.browserLanding .steps{margin-top:18px;text-align:left;background:var(--paper-soft);border:1px solid var(--line);border-radius:15px;padding:14px 16px;color:var(--text);font-size:14px;line-height:1.5}
.browserLanding .steps b{display:block;margin-bottom:5px}

/* Safety */
.card,.row,.grow,.taskTitle,label,summary{min-width:0}
.card b,.card .sm,.card .xs,.taskTitle,label,summary{overflow-wrap:anywhere}
@media(max-width:380px){
  .dashboardHero{padding-left:16px;padding-right:16px}
  .logoPlate{width:138px;height:46px}
  .heroBody{grid-template-columns:minmax(0,1fr) 86px}
  .dashboardKpis{gap:6px}
  .summaryTile{padding-left:4px;padding-right:4px}
  .summaryTitle{font-size:11px}
}

.filterScroll{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.filterScroll::-webkit-scrollbar{display:none}.filterScroll .btn{flex:0 0 auto}

.filterLabel{margin:12px 0 5px}
.actionSearch{display:flex;align-items:center;gap:8px;margin:10px 0 4px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.actionSearch span{font-size:20px;color:var(--muted)}
.actionSearch input{width:100%;border:0;outline:0;background:transparent;padding:12px 0;font:inherit;color:inherit}
.actionGroup{margin-top:15px}
.actionGroupHead{width:100%;border:0;background:transparent;padding:4px 2px 8px;display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:750;color:inherit;text-align:left}
.actionGroupCount{font-size:13px;color:var(--muted);font-weight:650}
.actionGroupList{margin-top:0}
.projectLate{border-left:4px solid var(--red)}
</style></head><body><main class="app"><div id="view"></div></main>
<button class="fab" id="fab">+</button>
<nav><div class="inner coreNav">
<button data-nav="pregled"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span>Pregled</span></button>
<button data-nav="akcije"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span><span>Akcije</span></button>
<button data-nav="projekti"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l1.8 2h9.2v9.5a2 2 0 0 1-2 2h-15z"/><path d="M3.5 7.5V5a2 2 0 0 1 2-2h4l1.8 2h7.2a2 2 0 0 1 2 2v2.5"/></svg></span><span>Projekti</span></button>
<button data-nav="beleske"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 20V5A1.5 1.5 0 0 1 6.5 3.5z"/><path d="M14.5 3.5V7h3.5M8 11h7M8 15h7"/></svg></span><span>Beleške</span></button>
</div></nav><dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<script>
const KEY="obaveze_app_v1";
const IMPORTED=[];
const $=q=>document.querySelector(q), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const iso=d=>{const x=new Date(d),y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,"0"),da=String(x.getDate()).padStart(2,"0");return `${y}-${m}-${da}`}, today=()=>iso(new Date());
function fmtDate(d){
 if(!d)return "";
 const [y,m,da]=String(d).split("-");
 return y&&m&&da?`${da}.${m}.${y}.`:d;
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){S={items:IMPORTED,people:[],weeklyReviews:[],lastId:0};}
function norm(){
 S.items=S.items||[];
 S.items.forEach(x=>{
  x.ID=Number(x.ID)||++S.lastId; S.lastId=Math.max(S.lastId,x.ID);
  if(x.Tip==="Akcija"){if(x.Status==="Novo"||x.Status==="U toku")x.Status="Otvoreno";if(x.Status==="Čeka")x.Status="Čeka drugog"}
 });
 S.items.filter(x=>x.Tip==="Projekat").forEach(x=>{if(!x.Status)x.Status="Aktivan"});
 if(!Array.isArray(S.weeklyReviews))S.weeklyReviews=[];
 S.people=[...new Set(S.items.map(x=>x.Odgovoran).filter(Boolean))].sort();
 save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

function isStandalone(){
 return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function renderBrowserLanding(){
 document.querySelector('nav').style.display='none';
 $('#fab').style.display='none';
 $('#view').innerHTML=`<section class="browserLanding"><div class="browserLandingCard">
  <div class="browserLandingLogo"><img src="https://www.grawe.at/fileadmin/shared/Logos/Logo_GRAWE_2021_RGB.jpg" alt="GRAWE"></div>
  <h1>Obaveze</h1>
  <div class="localBadge">● Lokalna aplikacija</div>
  <p>Radni podaci se čuvaju samo u instaliranoj aplikaciji na ovom uređaju. Ova web stranica služi samo za instalaciju i ažuriranje aplikacije.</p>
  <div class="steps"><b>Na iPhone-u</b>Otvori Share meni u Safariju i izaberi <strong>Add to Home Screen</strong>. Nakon instalacije, za svakodnevni rad otvaraj samo ikonicu <strong>Obaveze</strong> sa početnog ekrana.</div>
 </div></section>`;
}

function daysSince(d){
 if(!d)return 99999;
 return Math.floor((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/86400000);
}
function backupDue(){return !S._lastBackup || daysSince(S._lastBackup)>=14}
function reviewHistoryFor(id){
 return (S.weeklyReviews||[]).flatMap(r=>(r.items||[]).filter(x=>x.id===id));
}
function unchangedReviewStreak(id){
 const h=reviewHistoryFor(id).slice().reverse();
 let n=0;
 for(const x of h){if(x.action==="keep")n++;else break}
 return n;
}

function activeActions(){return S.items.filter(x=>x.Tip==="Akcija"&&x.Status!=="Završeno")}
function projects(){return S.items.filter(x=>x.Tip==="Projekat"&&x.Status!=="Završen")}
function notes(){return S.items.filter(x=>x.Tip==="Beleška")}
function projectName(x){return x.Projekat||""}
function projectActions(p){
 return activeActions().filter(x=>Number(x.ProjectID)===Number(p.ID));
}
function migrateProjectLinks(){
 projects().forEach(p=>{
  const name=p.Projekat||p.Zadatak||"";
  S.items.filter(x=>x.Tip==="Akcija"&&!x.ProjectID&&x.Projekat===name).forEach(x=>x.ProjectID=p.ID);
 });
}
function actionsForProject(p){
 const name=p.Projekat||p.Zadatak||"";
 return activeActions().filter(x=>x.Projekat===name||Number(x["Nadovezuje se na ID"])===Number(p.ID));
}
function daysTo(d){if(!d)return 99999;return Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function greeting(){
 const h=new Date().getHours();
 return h<11?"Dobro jutro":h<18?"Dobar dan":"Dobro veče";
}
function monthShort(d){
 if(!d)return "";
 const m=["JAN","FEB","MAR","APR","MAJ","JUN","JUL","AVG","SEP","OKT","NOV","DEC"];
 const dt=new Date(d+"T00:00:00"); return m[dt.getMonth()];
}

 action:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>`,
 project:`<svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.8 2h9.2v9.5a2 2 0 0 1-2 2h-15z"/><path d="M3.5 7.5V5a2 2 0 0 1 2-2h4l1.8 2h7.2a2 2 0 0 1 2 2v2.5"/></svg>`,

function attentionSort(a,b){
 const score=x=>{let s=0,d=daysTo(x.Rok);if(d<0)s+=1000;if(x.Prioritet==="Strateško")s+=500;if(d>=0&&d<=7)s+=300;if(x.Status==="Čeka drugog")s+=100;if(!x.Rok)s+=20;return -s};
 return score(a)-score(b);
}
function taskCard(x){
 const d=daysTo(x.Rok);
 const stripe=d<0?"var(--red)":d<=7?"var(--amber)":"#c0c8c3";
 const priClass=x.Prioritet==="Strateško"?"priority strategic":"priority";
 return `<div class="card tight" data-item="${x.ID}" style="border-left:4px solid ${stripe}">
  <div class="taskTitle">${esc(x.Zadatak)}</div>
  <div class="meta">
   ${x.Odgovoran?`<span class="chip person">${esc(x.Odgovoran)}</span>`:""}
   ${x.Prioritet?`<span class="chip ${priClass}">${esc(x.Prioritet)}</span>`:""}
   ${x.Projekat?`<span class="chip">${esc(x.Projekat)}</span>`:""}
   ${x.Rok?`<span class="chip date">${esc(fmtDate(x.Rok))}</span>`:""}
   ${unchangedReviewStreak(x.ID)>=3?`<span class="chip priority strategic">${unchangedReviewStreak(x.ID)} pregleda bez promjene</span>`:""}
  </div>
 </div>`;
}

function actionListCard(x){
 const d=daysTo(x.Rok);
 const cls=d<0?"late":d<=7?"soon":x.Prioritet==="Strateško"?"strategic":"";
 const due=x.Rok?(d<0?`Kasni ${Math.abs(d)} d`:d===0?"Danas":fmtDate(x.Rok)):"Bez roka";
 const dueCls=d<0?"late":d<=7?"soon":"";
 const meta=[x.Oblast==="Privatno"?"Privatno":"",x.Odgovoran,x.Projekat,x.Status==="Čeka drugog"?"Čeka drugog":""].filter(Boolean).map(esc).join(" · ");
 return `<div class="card secondaryCard ${cls}" data-item="${x.ID}">
  <div class="secondaryTop"><div class="taskTitle grow">${esc(x.Zadatak)}</div><div class="secondaryDue ${dueCls}">${esc(due)}</div></div>
  ${meta?`<div class="secondaryMeta">${meta}</div>`:""}
  ${x.Prioritet==="Strateško"?`<div class="meta"><span class="chip priority strategic">Strateško</span></div>`:""}
 </div>`;
}
function vAkcije(){
 const all=()=>activeActions().slice().sort(attentionSort);
 const isFiltered=()=>actionView.area!=="all"||actionView.priority!=="all"||actionView.status!=="all"||!!actionView.search;
 const baseFiltered=()=>{
  let arr=all();
  if(actionView.area!=="all")arr=arr.filter(x=>(x.Oblast||"Poslovno")===actionView.area);
  if(actionView.priority!=="all")arr=arr.filter(x=>x.Prioritet===actionView.priority);
  if(actionView.status==="Čeka drugog")arr=arr.filter(x=>x.Status==="Čeka drugog");
  if(actionView.search){
   const q=actionView.search.toLocaleLowerCase();
   arr=arr.filter(x=>[x.Zadatak,x.Odgovoran,x.Projekat,x.Izvor,x["Detalj izvora"],x["Detalji dogovora"]].filter(Boolean).join(" ").toLocaleLowerCase().includes(q));
  }
  return arr;
 };
 const groups=arr=>({
  late:arr.filter(x=>daysTo(x.Rok)<0),
  today:arr.filter(x=>x.Rok===today()),
  week:arr.filter(x=>daysTo(x.Rok)>=1&&daysTo(x.Rok)<=7),
  later:arr.filter(x=>daysTo(x.Rok)>7)
 });
 const section=(title,arr,key,collapsed=false)=>{
  if(!arr.length)return "";
  const open=key!=="later"||actionView.laterOpen||isFiltered();
  const body=collapsed&&!open?"":`<div class="list actionGroupList">${arr.map(actionListCard).join("")}</div>`;
  return `<section class="actionGroup"><button class="actionGroupHead" ${key==="later"?'id="toggleLater"':""}>
   <span>${title}</span><span class="actionGroupCount">${arr.length}${key==="later"?` ${open?"⌃":"⌄"}`:""}</span>
   </button>${body}</section>`;
 };
 const draw=()=>{
  const arr=baseFiltered(),g=groups(arr);
  $("#actionCount").textContent=isFiltered()?`${arr.length} prikazano · ${all().length} otvorenih`:`${all().length} otvorenih akcija`;
  $("#tasks").innerHTML=section("Kasni",g.late,"late")+section("Danas",g.today,"today")+section("Dospijeva u narednih 7 dana",g.week,"week")+section("Kasnije",g.later,"later",true)||`<div class="empty">Nema akcija u ovom prikazu.</div>`;
  bindCards();
  if($("#toggleLater"))$("#toggleLater").onclick=()=>{actionView.laterOpen=!actionView.laterOpen;draw()};
 };
 $("#view").innerHTML=head("Akcije")+`
 <div class="sm mute" id="actionCount"></div>
 <label class="actionSearch"><span aria-hidden="true">⌕</span><input id="actionSearch" type="search" placeholder="Pretraži akcije" value="${esc(actionView.search)}"></label>
 <div class="sm mute filterLabel">Oblast</div><div class="tabs filterScroll" id="areaFilters">
  ${[["all","Sve"],["Poslovno","Poslovno"],["Privatno","Privatno"]].map(([v,l])=>`<button class="btn ${actionView.area===v?"on":""}" data-area-filter="${v}">${l}</button>`).join("")}</div>
 <div class="sm mute filterLabel">Prioritet</div><div class="tabs filterScroll" id="priorityFilters">
  ${[["all","Sve"],["Strateško","Strateško"],["Operativno","Operativno"],["Sitno","Sitno"]].map(([v,l])=>`<button class="btn ${actionView.priority===v?"on":""}" data-priority-filter="${v}">${l}</button>`).join("")}</div>
 <div class="sm mute filterLabel">Status</div><div class="tabs filterScroll" id="statusFilters">
  ${[["all","Sve"],["Čeka drugog","Čeka drugog"]].map(([v,l])=>`<button class="btn ${actionView.status===v?"on":""}" data-status-filter="${v}">${l}</button>`).join("")}</div>
 <div id="tasks" style="margin-top:14px"></div>`;

 $("#actionSearch").oninput=e=>{actionView.search=e.target.value.trim();draw()};

 $("#view").querySelectorAll("[data-priority-filter]").forEach(b=>b.onclick=()=>{actionView.priority=b.dataset.priorityFilter;vAkcije()});
 $("#view").querySelectorAll("[data-status-filter]").forEach(b=>b.onclick=()=>{actionView.status=b.dataset.statusFilter;vAkcije()});
}

 openDlg(`<h2>${isNew?"Novo":"Uredi"} · ${esc(x.Tip)}</h2>
 <label class="f"><span class="sm mute">${x.Tip==="Projekat"?"Naziv projekta":x.Tip==="Beleška"?"Beleška":"Šta treba uraditi?"}</span><textarea id="eTask">${esc(x.Tip==="Projekat"?(x.Projekat||x.Zadatak):x.Zadatak||"")}</textarea></label>
 ${x.Tip!=="Projekat"?`<label class="f"><span class="sm mute">Oblast</span><select id="eArea"><option value="Poslovno" ${(x.Oblast||"Poslovno")==="Poslovno"?"selected":""}>Poslovno</option><option value="Privatno" ${x.Oblast==="Privatno"?"selected":""}>Privatno</option></select></label>`:""}
 ${x.Tip==="Akcija"?`<div class="row"><label class="f grow"><span class="sm mute">Odgovoran *</span><input id="eOwner" value="${esc(x.Odgovoran||"Ivan")}"></label><label class="f grow"><span class="sm mute">Rok *</span><input type="date" id="eDue" value="${esc(x.Rok||"")}"></label></div>`:""}
 ${x.Tip==="Akcija"&&!isNew?`<label class="f"><span class="sm mute">Status</span><select id="eActionStatus">${["Otvoreno","Čeka drugog","Završeno"].map(v=>`<option ${x.Status===v?"selected":""}>${v}</option>`).join("")}</select></label>`:""}
 ${x.Tip==="Projekat"?`<label class="f"><span class="sm mute">Rok projekta *</span><input type="date" id="eProjectDue" value="${esc(x.Rok||"")}"></label>
 <label class="f"><span class="sm mute">Sistem</span><select id="eProjectSystem">${["Osiguranje","Tehnički","Zajedničko"].map(v=>`<option value="${v}" ${(x.Sistem||"Osiguranje")===v?"selected":""}>${v}</option>`).join("")}</select></label>
 <label class="f"><span class="sm mute">Opis / kontekst</span><textarea id="eProjectDetails">${esc(x["Detalji dogovora"]||"")}</textarea></label>`:""}
 ${x.Tip!=="Projekat"?`<div id="eSourceWrap"><label class="f"><span class="sm mute">Izvor${x.Tip==="Akcija"?" *":""}</span><select id="eSource">${["","Kolegijum","Interni razno","1-1","Ad hoc","Klijenti","Regulator","Graz/uprava","Graz/ostalo","Eksterno razno"].map(v=>`<option value="${esc(v)}" ${x.Izvor===v?"selected":""}>${v||"—"}</option>`).join("")}</select></label>
 <label class="f" id="eSourceDetailWrap" style="display:none"><span class="sm mute" id="eSourceDetailLabel">Detalj izvora</span><input id="eSourceDetail" value="${esc(x["Detalj izvora"]||"")}"></label></div>`:""}
 ${x.Tip!=="Projekat"?`<details><summary class="btn">+ Više detalja</summary><div style="margin-top:10px">
 
 ${x.Tip!=="Beleška"?`<div class="row"><label class="f grow"><span class="sm mute">Prioritet</span><select id="ePriority">${["Strateško","Operativno","Sitno"].map(v=>`<option ${x.Prioritet===v?"selected":""}>${v}</option>`).join("")}</select></label><label class="f grow" id="eSystemWrap"><span class="sm mute">Sistem</span><select id="eSystem">${["Osiguranje","Tehnički","Zajedničko"].map(v=>`<option value="${v}" ${(x.Sistem||"Osiguranje")===v?"selected":""}>${v}</option>`).join("")}</select></label></div>`:`<label class="f" id="eSystemWrap"><span class="sm mute">Sistem</span><select id="eSystem">${["Osiguranje","Tehnički","Zajedničko"].map(v=>`<option value="${v}" ${(x.Sistem||"Osiguranje")===v?"selected":""}>${v}</option>`).join("")}</select></label>`}
 
 <label class="f"><span class="sm mute">${x.Tip==="Beleška"?"Kontekst / detalji":"Detalji / dogovor"}</span><textarea id="eDetails">${esc(x["Detalji dogovora"]||x.Napomena||"")}</textarea></label>
 </div></details>`:""}
 <div class="btnrow" style="margin-top:14px"><button class="btn pri grow" id="eSave">Sačuvaj</button><button class="btn" id="eCancel">Otkaži</button></div>`);
 const updateSourceDetail=()=>{
  const v=$("#eSource")?.value||"",wrap=$("#eSourceDetailWrap"),lab=$("#eSourceDetailLabel");
  const labels={"Interni razno":"Pojasni izvor","1-1":"Sa kim?","Klijenti":"Klijent / druga strana","Eksterno razno":"Druga strana / pojašnjenje"};
  if(wrap){const show=!!labels[v];wrap.style.display=show?"block":"none";if(lab)lab.textContent=(labels[v]||"Detalj izvora")+(x.Tip==="Akcija"&&show?" *":"");if(!show&&$("#eSourceDetail"))$("#eSourceDetail").value="";}
 };
 const updateArea=()=>{
  const business=x.Tip==="Projekat"||($("#eArea")?.value||"Poslovno")==="Poslovno";
  if($("#eSourceWrap"))$("#eSourceWrap").style.display=business?"block":"none";
  if($("#eSystemWrap"))$("#eSystemWrap").style.display=business?"block":"none";
  updateSourceDetail();
 };
 if($("#eSource"))$("#eSource").onchange=updateSourceDetail;
 if($("#eArea"))$("#eArea").onchange=updateArea;
 updateArea();
 $("#eCancel").onclick=closeDlg;$("#eSave").onclick=()=>{
  const task=$("#eTask").value.trim();if(!task){alert(x.Tip==="Akcija"?"Unesi akciju.":x.Tip==="Projekat"?"Unesi naziv projekta.":"Unesi belešku.");return;}
  if(x.Tip==="Projekat"&&!$("#eProjectDue")?.value){alert("Unesi rok projekta.");return;}
   if(x.Tip==="Akcija"){
    const owner=$("#eOwner")?.value.trim()||"", due=$("#eDue")?.value||"", source=$("#eSource")?.value||"";
    const needsDetail=["Interni razno","1-1","Klijenti","Eksterno razno"].includes(source);
    const sourceDetail=$("#eSourceDetail")?.value.trim()||"";
    if(!owner){alert("Unesi odgovorno lice.");return;}
    if(!due){alert("Unesi rok.");return;}
    if(($("#eArea")?.value||"Poslovno")==="Poslovno"&&!source){alert("Izaberi izvor.");return;}
    if(($("#eArea")?.value||"Poslovno")==="Poslovno"&&needsDetail&&!sourceDetail){alert("Popuni dodatno pojašnjenje izvora.");return;}
   }
  if(isNew){x.ID=++S.lastId;S.items.push(x)}
  if(x.Tip==="Projekat"){
    x.Projekat=task;x.Zadatak=task;x.Oblast="Poslovno";x.Rok=$("#eProjectDue").value;x.Sistem=$("#eProjectSystem").value||"Osiguranje";x["Detalji dogovora"]=$("#eProjectDetails").value||"";x.Status=x.Status==="Završen"?"Završen":"Aktivan";x.Prioritet="";x.Izvor="";x["Detalj izvora"]="";
    if(!isNew&&oldProjectName!==task)S.items.filter(a=>a.Tip==="Akcija"&&Number(a.ProjectID)===Number(x.ID)).forEach(a=>a.Projekat=task);
   }else x.Zadatak=task;
  x.Oblast=x.Tip==="Projekat"?"Poslovno":($("#eArea")?.value||"Poslovno");
  if(x.Tip==="Akcija"){x.Odgovoran=$("#eOwner").value.trim();x.Rok=$("#eDue").value;x.Status=$("#eActionStatus")?.value||x.Status||"Otvoreno"}
  if(x.Tip==="Projekat"){x.Status=$("#eProjectStatus")?.value||x.Status||"Aktivan"}
  x.Projekat=x.Projekat||"";x.ProjectID=x.ProjectID||null;x.Prioritet=$("#ePriority")?.value||x.Prioritet||"";x.Sistem=$("#eSystem")?.value||x.Sistem||"";
  x.Izvor=$("#eSource")?.value.trim()||x.Izvor||"";x["Detalj izvora"]=$("#eSourceDetail")?.value.trim()||"";x["Detalji dogovora"]=$("#eDetails")?.value||"";x.Napomena="";
  save();norm();closeDlg();
  if(x.Tip==="Projekat")route="projekti";
  else if(x.Tip==="Beleška")route="beleske";
  render();
 };
}
function quickAdd(){
 openDlg(`<h2>Novi zapis</h2><div class="list" style="margin-top:12px"><button class="card" data-type="Akcija"><b>Akcija</b><div class="sm mute">Konkretna stvar koju treba uraditi</div></button><button class="card" data-type="Beleška"><b>Beleška</b><div class="sm mute">Informacija bez obavezne akcije</div></button><button class="card" data-type="Projekat"><b>Projekat</b><div class="sm mute">Tema koja ima više akcija</div></button></div>`);
 $("#dlgBody").querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>editItem(null,b.dataset.type));
}
function projectDialog(id){
 const p=S.items.find(x=>x.ID===id);if(!p)return;
 const name=p.Projekat||p.Zadatak,a=projectActions(p);
 openDlg(`<div class="row between"><h2>${esc(name)}</h2><button class="btn" id="pc">×</button></div>
 <div class="meta" style="margin:8px 0 10px">${p.Rok?`<span class="chip date">Rok ${esc(fmtDate(p.Rok))}</span>`:""}${p.Sistem?`<span class="chip">${esc(p.Sistem)}</span>`:""}</div>
 ${p["Detalji dogovora"]?`<div class="sm mute" style="margin:8px 0 12px">${esc(p["Detalji dogovora"])}</div>`:""}
 <div class="btnrow"><button class="btn pri grow" id="pa">+ Akcija</button><button class="btn grow" id="pe">Uredi</button></div>
 <button class="btn" style="width:100%;margin-top:8px" id="pf">Završi projekat</button>
 <div class="list" style="margin-top:12px">${a.map(taskCard).join("")||`<div class="empty">Nema otvorenih akcija.</div>`}</div>`);
 $("#pc").onclick=closeDlg;
 $("#pa").onclick=()=>editItem(null,"Akcija",{Projekat:name,ProjectID:p.ID,Oblast:"Poslovno"});
 $("#pe").onclick=()=>editItem(p);
 $("#pf").onclick=()=>{
  const open=projectActions(p);
  if(open.length){alert(`Projekat ima ${open.length} otvoren${open.length===1?"u akciju":"ih akcija"}. Prvo ih završi.`);return;}
  if(confirm(`Završi projekat "${name}"?`)){p.Status="Završen";save();closeDlg();render()}
 };
 bindCards()
}
function personDialog(name){const a=activeActions().filter(x=>x.Odgovoran===name);openDlg(`<div class="row between"><h2>${esc(name)}</h2><button class="btn" id="oc">×</button></div><div class="sm mute" style="margin:8px 0 12px">${a.length} otvorenih stavki</div><button class="btn pri" id="oa">+ Akcija</button><div class="list" style="margin-top:12px">${a.map(taskCard).join("")||`<div class="empty">Nema otvorenih akcija.</div>`}</div>`);$("#oc").onclick=closeDlg;$("#oa").onclick=()=>editItem(null,"Akcija",{Odgovoran:name});bindCards()}
function weeklyReview(){
 reviewActive=true;
 const a=activeActions().slice().sort(attentionSort);
 let i=0;
 const result={date:today(),closed:0,moved:0,waiting:0,kept:0,items:[]};

 const record=(x,action)=>result.items.push({id:x.ID,action});

 const finishReview=()=>{
   reviewActive=false;S.weeklyReviews.push(result);save();
   openDlg(`<h2>Nedeljni pregled završen</h2>
   <div class="kpis" style="margin-top:12px">
    <div class="kpi"><div class="xs">Završeno</div><div class="num">${result.closed}</div></div>
    <div class="kpi"><div class="xs">Pomjeren rok</div><div class="num">${result.moved}</div></div>
    <div class="kpi"><div class="xs">Čeka drugog</div><div class="num">${result.waiting}</div></div>
    <div class="kpi"><div class="xs">Ostavljeno</div><div class="num">${result.kept}</div></div>
   </div>
   <button class="btn pri" style="width:100%" id="wrDone">Zatvori</button>`);
   $("#wrDone").onclick=()=>{closeDlg();render()};
 };

 const show=()=>{
  if(i>=a.length)return finishReview();
  const x=a[i],streak=unchangedReviewStreak(x.ID);
  openDlg(`<div class="xs">Nedeljni pregled · ${i+1}/${a.length}</div>
   <h2 style="margin-top:7px">${esc(x.Zadatak)}</h2>
   <div class="meta">${x.Projekat?`<span class="chip">${esc(x.Projekat)}</span>`:""}${x.Odgovoran?`<span class="chip person">${esc(x.Odgovoran)}</span>`:""}${x.Rok?`<span class="chip date">${esc(fmtDate(x.Rok))}</span>`:""}${streak>=2?`<span class="chip priority strategic">${streak} pregleda bez promjene</span>`:""}</div>
   <div class="btnrow" style="margin-top:16px"><button class="btn grow" id="keep">Ostavi</button><button class="btn grow" id="wait">Čeka drugog</button></div>
   <div class="btnrow" style="margin-top:8px"><button class="btn grow" id="date">Promijeni rok</button><button class="btn pri grow" id="finish">Završi</button></div><button class="btn" style="width:100%;margin-top:8px" id="wrStop">Prekini pregled</button>`);

  $("#wrStop").onclick=()=>{reviewActive=false;result.partial=true;result.completed=i;S.weeklyReviews.push(result);save();closeDlg();render()};
   $("#keep").onclick=()=>{result.kept++;record(x,"keep");i++;show()};
  $("#wait").onclick=()=>{x.Status="Čeka drugog";result.waiting++;record(x,"wait");save();i++;show()};
  $("#finish").onclick=()=>{x.Status="Završeno";result.closed++;record(x,"finish");save();i++;show()};
  $("#date").onclick=()=>{
    openDlg(`<div class="xs">Promijeni rok</div><h2 style="margin-top:7px">${esc(x.Zadatak)}</h2>
     <label class="f" style="margin-top:14px"><span class="sm mute">Novi rok</span><input type="date" id="wrDate" value="${esc(x.Rok||today())}"></label>
     <div class="btnrow"><button class="btn grow" id="wrDateBack">Nazad</button><button class="btn pri grow" id="wrDateSave">Sačuvaj</button></div>`);
    $("#wrDateBack").onclick=show;
    $("#wrDateSave").onclick=()=>{const d=$("#wrDate").value;if(!d)return;x.Rok=d;result.moved++;record(x,"move");save();i++;show()};
  };
 };
 show();
}
function reviewHistoryDialog(){
 const rs=(S.weeklyReviews||[]).slice().reverse();
 openDlg(`<div class="row between"><h2>Istorija nedeljnih pregleda</h2><button class="btn" id="rhc">×</button></div>
 <div class="list" style="margin-top:12px">${rs.map(r=>`<div class="card tight"><b>${esc(fmtDate(r.date||""))}${r.partial?" · prekinut":""}</b><div class="sm mute" style="margin-top:5px">Završeno ${r.closed||0} · Rok pomjeren ${r.moved||0} · Čeka ${r.waiting||0} · Ostavljeno ${r.kept||0}</div></div>`).join("")||`<div class="empty">Još nema nedeljnih pregleda.</div>`}</div>`);
 $("#rhc").onclick=closeDlg;
}

function notesDialog(){openDlg(`<div class="row between"><h2>Beleške</h2><button class="btn" id="nc">×</button></div><div class="list" style="margin-top:12px">${notes().map(n=>`<div class="card tight"><b>${esc(n.Zadatak)}</b><div class="sm mute">${esc(n.Projekat||n.Sistem||"")}</div><button class="btn sm" data-noteaction="${n.ID}" style="margin-top:8px">Pretvori u akciju</button></div>`).join("")||`<div class="empty">Nema beleški.</div>`}</div>`);$("#nc").onclick=closeDlg;$("#dlgBody").querySelectorAll("[data-noteaction]").forEach(b=>b.onclick=()=>{const n=S.items.find(x=>x.ID===Number(b.dataset.noteaction));n.Tip="Akcija";n.Status="Otvoreno";n.Odgovoran=n.Odgovoran||"Ivan";save();closeDlg();render()})}
function archiveDialog(){openDlg(`<div class="row between"><h2>Arhiva</h2><button class="btn" id="ac">×</button></div><div class="list" style="margin-top:12px">${S.items.filter(x=>x.Status==="Završeno"||x.Status==="Završen").map(taskCard).join("")||`<div class="empty">Arhiva je prazna.</div>`}</div>`);$("#ac").onclick=closeDlg;bindCards()}
function exportData(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="obaveze-backup-"+today()+".json";a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);openDlg(`<h2>Backup pokrenut</h2><p class="mute" style="margin:10px 0 16px">Ako je fajl uspješno sačuvan na uređaju, potvrdi ispod. Tek tada će se računati novi rok od 14 dana.</p><div class="btnrow"><button class="btn pri grow" id="backupOk">Fajl je sačuvan</button><button class="btn grow" id="backupNo">Nije sačuvan</button></div>`);$("#backupOk").onclick=()=>{S._lastBackup=today();save();closeDlg()};$("#backupNo").onclick=closeDlg},300);
}
function importData(){
 const input=document.createElement("input");input.type="file";input.accept="application/json,.json";
 input.onchange=()=>{
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
   try{
    const data=JSON.parse(String(r.result||""));
    if(!data||!Array.isArray(data.items))throw new Error("format");
    openDlg(`<h2>Vrati backup?</h2><p class="mute" style="margin:10px 0 16px">Trenutni lokalni podaci biće zamijenjeni sadržajem iz <b>${esc(f.name)}</b>.</p><div class="btnrow"><button class="btn danger grow" id="importYes">Vrati backup</button><button class="btn grow" id="importNo">Otkaži</button></div>`);
    $("#importNo").onclick=closeDlg;
    $("#importYes").onclick=()=>{S=data;if(!Array.isArray(S.weeklyReviews))S.weeklyReviews=[];S.lastId=Number(S.lastId)||0;norm();closeDlg();render()};
   }catch(e){openDlg(`<h2>Backup nije učitan</h2><p class="mute" style="margin:10px 0 16px">Izabrani fajl nije prepoznat kao važeći backup aplikacije Obaveze.</p><button class="btn pri" style="width:100%" id="importErrClose">Zatvori</button>`);$("#importErrClose").onclick=closeDlg}
  };
  r.readAsText(f);
 };
 input.click();
}
function resetData(){
 openDlg(`<h2>Resetuj sve podatke?</h2><p class="mute" style="margin:10px 0 16px">Ovo trajno briše sve lokalne projekte, akcije, beleške i istoriju nedeljnih pregleda na ovom uređaju.</p><div class="btnrow"><button class="btn danger grow" id="resetYes">Obriši sve</button><button class="btn grow" id="resetNo">Otkaži</button></div>`);
 $("#resetNo").onclick=closeDlg;
 $("#resetYes").onclick=()=>{localStorage.removeItem(KEY);S={items:[],people:[],weeklyReviews:[],lastId:0};save();closeDlg();render()};
}
function bindCards(){document.querySelectorAll("[data-item]").forEach(c=>c.onclick=()=>itemDialog(Number(c.dataset.item)))}
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js?v=20260829-3").then(reg=>reg.update()).catch(()=>{});
 });
}
if(isStandalone()){
 document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{route=b.dataset.nav;render()});
 $("#fab").onclick=()=>{if(route==="akcije")editItem(null,"Akcija");else if(route==="projekti")editItem(null,"Projekat");else if(route==="beleske")editItem(null,"Beleška");else quickAdd()};
 $("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg")&&!reviewActive)closeDlg()});
 norm();render();
}else{
 renderBrowserLanding();
}
</script></body></html>
