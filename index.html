<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007a3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Obaveze"><link rel="manifest" href="manifest.json?v=20260829-2"><link rel="apple-touch-icon" href="icon-192.png?v=20260829-2"><title>Obaveze</title>
<style>
:root{
  --bg:#f5f7f6;
  --paper:#ffffff;
  --paper-soft:#fafbfa;
  --ink:#17201b;
  --text:#253029;
  --mute:#7b8680;
  --line:#e0e6e2;
  --green:#007a3d;
  --green-deep:#006b35;
  --green-soft:#eaf5ef;
  --amber:#e09a18;
  --amber-soft:#fff5df;
  --red:#d94f55;
  --red-soft:#fff0f1;
  --shadow:0 7px 22px rgba(27,54,40,.08);
  --shadow-soft:0 3px 12px rgba(27,54,40,.06);
  --radius:18px;
  --muted:var(--mute);
  --card:var(--paper);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:0 16px 110px}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.sm{font-size:13px}
.xs{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:800}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.hot{color:var(--red)}
.amber{color:var(--amber)}
.green{color:var(--green)}

/* ===== Exact approved dashboard direction ===== */
.dashboardHero{
  margin:0 -16px 14px;
  padding:13px 18px 14px;
  min-height:0;
  background:linear-gradient(145deg,#008348 0%,#006f39 56%,#006130 100%);
  color:#fff;
  border-radius:0 0 18px 18px;
  box-shadow:0 6px 20px rgba(0,92,47,.14);
}
.heroTop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logoPlate{
  width:146px;height:47px;
  background:#fff;
  border-radius:9px;
  padding:5px 8px;
  display:flex;align-items:center;
  box-shadow:0 2px 9px rgba(0,0,0,.08);
}
.logoPlate img{display:block;width:100%;height:100%;object-fit:contain}
.menuCircle{
  width:40px;height:40px;border-radius:11px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);
  color:#fff;display:grid;place-items:center;
  font-size:22px;line-height:1;
}
.heroBody{
  display:grid;
  grid-template-columns:minmax(0,1fr) 88px;
  gap:12px;
  align-items:center;
  margin-top:12px;
}
.greeting{font-size:21px;line-height:1.08;font-weight:500;letter-spacing:-.02em}
.greeting b{font-weight:800}
.heroSub{margin-top:5px;font-size:13px;color:rgba(255,255,255,.84)}
.priorityCard{
  min-height:72px;
  border-radius:12px;
  padding:9px 7px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.10);
  text-align:center;
  display:flex;flex-direction:column;justify-content:center;
}
.priorityLabel{font-size:10px;color:rgba(255,255,255,.9)}
.priorityLabel .star{color:#ffc43d;margin-right:4px}
.priorityNumber{font-size:25px;font-weight:800;line-height:1;margin:4px 0 2px}
.priorityFoot{font-size:10px;color:rgba(255,255,255,.82)}

.dashboardKpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
  margin-bottom:13px;
}
.summaryTile{
  min-width:0;
  min-height:88px;
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  padding:8px 5px 7px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.summaryIcon{width:22px;height:22px;color:var(--green);margin-bottom:4px}
.summaryIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.summaryTitle{font-size:10px;line-height:1.1;color:#1f2823;min-height:22px;display:flex;align-items:center;justify-content:center}
.summaryValue{font-size:23px;line-height:1;font-weight:800;color:var(--green-deep);margin:4px 0 3px}
.summaryFoot{font-size:9px;color:var(--green-deep);line-height:1.1}
.summaryTile.due .summaryFoot{color:var(--amber)}
.summaryTile.zero{opacity:.53}
.summaryTile.zero .summaryValue{color:#8f9993}

.sectionHead{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin:13px 2px 7px;
}
.sectionHead h2{font-size:16px;letter-spacing:-.01em}
.sectionLink{
  color:var(--green-deep);font-size:13px;font-weight:700;
  border:0;background:none;padding:4px 0;
}
.sectionCard{
  background:#fff;
  border:1px solid #edf0ee;
  border-radius:13px;
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}
.todayRow,.upcomingRow{
  position:relative;
  display:grid;
  align-items:center;
  min-width:0;
}
.todayRow{
  grid-template-columns:34px minmax(0,1fr) auto 24px;
  gap:10px;
  padding:12px 14px 12px 16px;
  min-height:68px;
}
.todayRow+.todayRow,.upcomingRow+.upcomingRow{border-top:1px solid var(--line)}
.todayRow:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#c4ccc7;
}
.todayRow.soon:before{background:var(--amber)}
.todayRow.late:before{background:var(--red)}
.checkBox,.pendingCircle{
  width:24px;height:24px;border:1.7px solid #9aa49e;border-radius:50%;
  background:#fff;padding:0;
}
.pendingCircle{justify-self:end}
.checkBox:active,.pendingCircle:active{background:#eef2ef}
.rowTitle{font-size:14px;font-weight:750;line-height:1.22;overflow-wrap:anywhere}
.rowMeta{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.25}
.rowDue{font-size:11px;font-weight:700;color:var(--red);white-space:nowrap}
.upcomingRow{
  grid-template-columns:54px minmax(0,1fr) 27px;
  gap:11px;padding:11px 14px;min-height:66px;
}
.dateBox{border-right:1px solid var(--line);padding-right:10px;text-align:center}
.dateDay{font-size:21px;line-height:1;font-weight:800;color:var(--green-deep)}
.dateMonth{font-size:10px;text-transform:uppercase;color:var(--mute);margin-top:4px;font-weight:700}
.typeIcon{width:24px;height:24px;color:var(--green);display:grid;place-items:center}
.typeIcon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dashboardEmpty{padding:17px;text-align:center;color:var(--mute);font-size:13px}

/* Other screens, same visual language */
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin:0 -16px 14px;padding:19px 18px 17px;
  background:linear-gradient(145deg,#008348 0%,#006f39 68%,#006130 100%);
  color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(0,92,47,.12);
}
.top h1{font-size:25px;letter-spacing:-.025em}
.top .sm{margin-top:3px;color:rgba(255,255,255,.78)}
.top .btn{width:42px;height:42px;padding:0;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}
.card{
  background:#fff;border:1px solid #edf0ee;border-radius:16px;
  padding:15px;margin-bottom:10px;box-shadow:var(--shadow-soft);min-width:0;
}
.tight{padding:13px}
.list{display:flex;flex-direction:column;gap:9px}
.list>.card{margin-bottom:0}
.taskTitle{font-size:15px;font-weight:750;line-height:1.28;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;
  min-height:26px;padding:4px 9px;border-radius:999px;
  background:#f3f5f4;border:1px solid #e2e7e4;
  color:#68736d;font-size:11px;line-height:1.1;
}
.chip.person{background:var(--green-soft);border-color:#d1e9dc;color:var(--green-deep)}
.chip.priority.strategic{background:var(--amber-soft);border-color:#f1d69c;color:#976310}
.chip.date{background:#f6f7f6;color:#6b756f}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;
}
.btn.pri,.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:750}
.btn.danger,.danger{color:var(--red)}
.btnrow{display:flex;gap:8px}.btnrow .grow{flex:1}
.tabs{display:flex;gap:6px;overflow:auto;margin:0 -2px 12px;padding:2px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{white-space:nowrap;border-radius:999px;padding:8px 12px;font-size:13px;color:#68736d;background:#fff}
.tabs .btn.on{background:var(--green-soft);border-color:#cfe5d8;color:var(--green-deep);font-weight:750}
.secondaryCard{position:relative;padding:14px 14px 13px 16px;overflow:hidden}
.secondaryCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#c4ccc7}
.secondaryCard.late:before{background:var(--red)}
.secondaryCard.soon:before{background:var(--amber)}
.secondaryCard.strategic:before{background:#c4ccc7}
.secondaryTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.secondaryDue{font-size:11px;font-weight:750;white-space:nowrap;color:var(--mute);padding-top:1px}
.secondaryDue.late{color:var(--red)}
.secondaryDue.soon{color:var(--amber)}
.secondaryMeta{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.3}
.projectCard,.noteCard{padding:14px}
.projectLead,.noteLead{display:flex;align-items:flex-start;gap:12px}
.secondaryIcon{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--green-soft);color:var(--green-deep);display:grid;place-items:center}
.secondaryIcon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.countBadge{display:inline-flex;align-items:center;justify-content:center;min-width:62px;min-height:27px;padding:4px 8px;border-radius:999px;background:#f2f5f3;color:var(--green-deep);font-size:11px;font-weight:750;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.kpi{background:#fff;border:1px solid #edf0ee;border-radius:15px;padding:12px;box-shadow:var(--shadow-soft)}
.kpi .num{font-size:27px;margin-top:3px}
.kpi.zero{opacity:.55}
.f{display:block;margin-bottom:11px}.f span{display:block;margin-bottom:5px}
input,select,textarea{
  width:100%;background:#fff;border:1px solid #dce3df;border-radius:11px;padding:11px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,122,61,.10)}
textarea{min-height:96px;resize:vertical}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Dialogs */
dialog{border:0;background:transparent;padding:0;width:min(680px,calc(100% - 20px));color:var(--ink)}
dialog::backdrop{background:rgba(12,24,17,.38);backdrop-filter:blur(2px)}
.sheet{
  background:var(--bg);border:1px solid var(--line);border-radius:21px;
  padding:16px;max-height:88vh;overflow:auto;box-shadow:0 18px 55px rgba(14,34,22,.19);
}

/* FAB */
.fab{
  position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:82px;
  width:60px;height:60px;border-radius:50%;border:5px solid var(--bg);
  background:linear-gradient(145deg,#00864a,#006f39);color:#fff;font-size:31px;
  box-shadow:0 9px 28px rgba(0,111,57,.28);z-index:20;
}

/* Bottom navigation */
nav{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);backdrop-filter:blur(16px);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:19;
}
nav .inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr)}
nav button{
  min-height:72px;background:none;border:0;color:#7f8983;padding:9px 2px 7px;
  font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;
}
.navIcon{width:25px;height:25px}
.navIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--green-deep)}
nav button.on:after{
  content:"";position:absolute;bottom:4px;left:29%;right:29%;height:3px;border-radius:3px;background:var(--green);
}

/* Browser / install landing */
.browserLanding{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px 60px}
.browserLandingCard{width:min(520px,100%);background:#fff;border:1px solid #edf0ee;border-radius:22px;box-shadow:var(--shadow);padding:24px 20px;text-align:center}
.browserLandingLogo{width:170px;height:58px;margin:0 auto 20px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}
.browserLandingLogo img{display:block;width:100%;height:100%;object-fit:contain}
.browserLanding h1{font-size:28px;letter-spacing:-.02em;margin-bottom:8px}
.browserLanding p{font-size:15px;line-height:1.5;color:var(--mute);margin:0 auto;max-width:420px}
.browserLanding .localBadge{display:inline-flex;align-items:center;gap:7px;margin:18px 0 16px;padding:8px 12px;border-radius:999px;background:var(--green-soft);color:var(--green-deep);font-size:13px;font-weight:750}
.browserLanding .steps{margin-top:18px;text-align:left;background:var(--paper-soft);border:1px solid var(--line);border-radius:15px;padding:14px 16px;color:var(--text);font-size:14px;line-height:1.5}
.browserLanding .steps b{display:block;margin-bottom:5px}

/* Safety */
.card,.row,.grow,.taskTitle,label,summary{min-width:0}
.card b,.card .sm,.card .xs,.taskTitle,label,summary{overflow-wrap:anywhere}
@media(max-width:380px){
  .dashboardHero{padding-left:16px;padding-right:16px}
  .logoPlate{width:138px;height:46px}
  .heroBody{grid-template-columns:minmax(0,1fr) 86px}
  .dashboardKpis{gap:6px}
  .summaryTile{padding-left:4px;padding-right:4px}
  .summaryTitle{font-size:11px}
}

.filterScroll{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.filterScroll::-webkit-scrollbar{display:none}.filterScroll .btn{flex:0 0 auto}

.filterLabel{margin:12px 0 5px}
.actionSearch{display:flex;align-items:center;gap:8px;margin:10px 0 4px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.actionSearch span{font-size:20px;color:var(--muted)}
.actionSearch input{width:100%;border:0;outline:0;background:transparent;padding:12px 0;font:inherit;color:inherit}
.actionGroup{margin-top:15px}
.actionGroupHead{width:100%;border:0;background:transparent;padding:4px 2px 8px;display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:750;color:inherit;text-align:left}
.actionGroupCount{font-size:13px;color:var(--muted);font-weight:650}
.actionGroupList{margin-top:0}
.projectLate{border-left:4px solid var(--red)}

.projectActionsTitle{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
.projectActionsWrap{margin-top:8px}
.projectActionGroup{margin-top:13px}
.projectActionHead{display:flex;justify-content:space-between;align-items:center;padding:0 2px 6px;font-size:13px;font-weight:750;color:var(--muted)}
.noteInput{min-height:180px}.noteFull{white-space:pre-wrap;font-size:16px;line-height:1.5;margin-top:14px}

.menuSectionLabel{margin:16px 2px 7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.menuItem{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;color:inherit}
.backupNotice{border-left:4px solid var(--amber)}
.personActionGroup,.archiveSection{margin-top:14px}

.meetingCard{cursor:pointer}
.meetingKpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.meetingKpis .kpi{padding:10px 6px}
.meetingKpis .num{font-size:23px}
.meetingAddGrid{display:grid;grid-template-columns: repeat(2,1fr);gap:8px;margin-top:12px}
.meetingAddGrid .btn{padding-left:6px;padding-right:6px}
.meetingGroup{margin-top:12px}
@media(max-width:380px){.meetingKpis{grid-template-columns:repeat(2,1fr)}}


.seriesLink{border:0;background:none;padding:6px 0;color:var(--green-deep);font-weight:750;font-size:13px}
.seriesCard{cursor:pointer}


.meetingTitle{margin-top:5px;font-size:14px;font-weight:750;color:var(--text)}


.starMark{font-weight:700}

.minutesPreview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px}
.minutesPreview .minutesTitle{font-size:22px;font-weight:800;text-align:center;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 4px 12px}
.minutesMetaGrid{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:start;margin:14px 0 18px}
.minutesMetaLabel{font-size:12px;color:var(--mute);font-weight:750;padding-top:9px}
.minutesPreview input,.minutesPreview textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.minutesSection{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.minutesSection h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--green-deep);margin:0 0 7px}
.minutesSection textarea{min-height:92px;line-height:1.45;resize:vertical}
.minutesHint{font-size:12px;color:var(--mute);line-height:1.4;margin-top:8px}
.minutesActions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media(max-width:380px){.minutesMetaGrid{grid-template-columns:1fr;gap:4px}.minutesMetaLabel{padding-top:0}.minutesActions{grid-template-columns:1fr}}


.agendaMeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.agendaConclusion{margin-top:7px;font-size:13px;line-height:1.4;color:var(--text)}
.agendaUnprocessed{border-left:4px solid var(--amber)}
.agendaTransferred{border-left:4px solid var(--green)}
.seriesReview{margin:14px 0 4px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper-soft)}
.seriesReviewGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.seriesReviewStat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center}
.seriesReviewStat b{display:block;font-size:20px}
.seriesReviewList{margin-top:10px}
.seriesReviewItem{padding:9px 10px;border-top:1px solid var(--line);cursor:pointer}
.seriesReviewItem:first-child{border-top:0}
.finishTopic{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.finishTopic:first-child{border-top:0}.finishTopic input{width:auto;margin-top:4px}
.minutesPreview{max-width:680px;margin:12px auto 0}
.minutesHeader{text-align:center;padding-bottom:14px;border-bottom:2px solid var(--green)}
.minutesHeader h2{font-size:23px;margin:0 0 4px}
.minutesHeader .minutesSub{font-size:14px;color:var(--mute);font-weight:650}
.minutesFacts{display:grid;grid-template-columns:105px 1fr;gap:7px 12px;margin-top:14px;text-align:left}
.minutesFactLabel{font-size:12px;color:var(--mute);font-weight:750}
.minutesLocked{background:var(--paper-soft);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.minutesRecord{border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px;background:#fff}
.minutesRecordHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.minutesRecordTitle{font-weight:800;line-height:1.35}
.minutesRecordMeta{font-size:12px;color:var(--mute);margin-top:5px;line-height:1.45}
.minutesRecordText{font-size:13px;line-height:1.5;margin-top:7px;white-space:pre-wrap}
.minutesEdit{border:0;background:none;color:var(--green-deep);font-weight:750;padding:2px 0;white-space:nowrap}
.minutesFreeText{min-height:95px;line-height:1.5;resize:vertical}
.minutesGenerated{font-size:11px;color:var(--mute);text-align:center;margin-top:14px}
@media(max-width:380px){.seriesReviewGrid{grid-template-columns:1fr}.minutesFacts{grid-template-columns:1fr;gap:3px}.minutesRecordHead{display:block}.minutesEdit{margin-top:6px}}


/* Dashboard alignment: one common horizontal frame */
.dashboardContent{width:100%;margin:0;padding:0 18px}
.dashboardContent .areaTabs{width:max-content;max-width:100%;margin:12px auto 12px!important;padding-left:0;padding-right:0;justify-content:center}
.dashboardContent .dashboardKpis{width:100%;margin-left:0;margin-right:0}
.dashboardContent>.sectionHead{width:100%;margin-left:0;margin-right:0}
.dashboardContent>.sectionCard{width:100%;margin-left:0;margin-right:0}


/* Dashboard meeting rows: date/status must never be clipped */
.dashboardContent [data-dashboard-meeting].upcomingRow{
  grid-template-columns:54px minmax(0,1fr) auto;
  gap:11px;
}
.dashboardContent [data-dashboard-meeting] .rowDue{
  min-width:max-content;
  max-width:none;
  width:auto;
  text-align:right;
  justify-self:end;
  white-space:nowrap;
  overflow:visible;
}
.dashboardContent [data-dashboard-meeting]>div:nth-child(2){
  min-width:0;
}
@media (max-width:390px){
  .dashboardContent{padding-left:14px;padding-right:14px}
  .dashboardContent [data-dashboard-meeting].upcomingRow{
    grid-template-columns:48px minmax(0,1fr) auto;
    gap:8px;
    padding-left:10px;
    padding-right:10px;
  }
  .dashboardContent [data-dashboard-meeting] .rowDue{
    font-size:10px;
  }
}

<script>
const KEY="obaveze_app_v1";
const IMPORTED=[];
const $=q=>document.querySelector(q), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const iso=d=>{const x=new Date(d),y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,"0"),da=String(x.getDate()).padStart(2,"0");return `${y}-${m}-${da}`}, today=()=>iso(new Date());
function fmtDate(d){
 if(!d)return "";
 const [y,m,da]=String(d).split("-");
 return y&&m&&da?`${da}.${m}.${y}.`:d;
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){S={items:IMPORTED,people:[],meetings:[],meetingSeries:[],lastId:0,lastMeetingId:0,lastSeriesId:0};}
function norm(){
 S.items=S.items||[];
 if("weeklyReviews" in S)delete S.weeklyReviews;
 S.items.forEach(x=>{
  x.ID=Number(x.ID)||++S.lastId; S.lastId=Math.max(S.lastId,x.ID);
  if(x.Tip==="Akcija"){x.Status=x.Status==="Završeno"?"Završeno":"Otvoreno";delete x.CekaDrugog;if(x.Prioritet==="Operativno"||x.Prioritet==="Sitno")x.Prioritet="";}
  if(x.Tip==="Akcija"||x.Tip==="Projekat"){
   if(!Array.isArray(x.RokIstorija))x.RokIstorija=[];
   if(x.Tip==="Akcija"&&!Array.isArray(x.OdgovorniIstorija))x.OdgovorniIstorija=[];
  }
  if(x.Tip==="Beleška"&&x.KolegijumID&&typeof x.AgendaStavka!=="boolean")x.AgendaStavka=true;
  if(x.Tip==="Beleška"&&x.AgendaStavka===true){
   if(typeof x.Zakljucak!=="string")x.Zakljucak="";
   if(typeof x.PrenesiDalje!=="boolean")x.PrenesiDalje=false;
  }
  if(x.Tip==="Beleška"&&typeof x.ZaSledeciSastanak!=="boolean")x.ZaSledeciSastanak=false;
  if(x.SerijaID)x.SerijaID=Number(x.SerijaID)||null;
  if(x.AgendaIzvorID)x.AgendaIzvorID=Number(x.AgendaIzvorID)||null;
  if(x.PrenesenoIzSastankaID)x.PrenesenoIzSastankaID=Number(x.PrenesenoIzSastankaID)||null;
  if(x.PrenesenoNaSastanakID)x.PrenesenoNaSastanakID=Number(x.PrenesenoNaSastanakID)||null;
 });
 S.items.filter(x=>x.Tip==="Projekat").forEach(x=>{if(!x.Status)x.Status="Aktivan"});
 if(!Array.isArray(S.meetings))S.meetings=[];
 if(!Array.isArray(S.meetingSeries))S.meetingSeries=[];
 S.lastMeetingId=Number(S.lastMeetingId)||0;
 S.lastSeriesId=Number(S.lastSeriesId)||0;
 S.meetings.forEach(m=>{
  if(m&&"Naziv" in m&&!m.Naslov)m.Naslov=m.Naziv||"";
  if(m&&"Naziv" in m)delete m.Naziv;
  m.ID=Number(m.ID)||++S.lastMeetingId;
  S.lastMeetingId=Math.max(S.lastMeetingId,m.ID);
  if(m&&m.SerijaID)m.SerijaID=Number(m.SerijaID)||null;
  if(!Array.isArray(m.Ucesnici))m.Ucesnici=typeof m.Ucesnici==="string"?m.Ucesnici.split(/[,\n]/).map(x=>x.trim()).filter(Boolean):[];
  m.Status=m.Status==="Završen"?"Završen":"Aktivan";
 });
 S.meetingSeries.forEach(s=>{
  s.ID=Number(s.ID)||++S.lastSeriesId;
  S.lastSeriesId=Math.max(S.lastSeriesId,s.ID);
  if(!Array.isArray(s.Ucesnici))s.Ucesnici=typeof s.Ucesnici==="string"?s.Ucesnici.split(/[,\n]/).map(x=>x.trim()).filter(Boolean):[];
  s.Tip=s.Tip==="Projektna"?"Projektna":"Redovna";
  s.Status=s.Status==="Završen"?"Završen":"Aktivan";
  if(typeof s.Cilj!=="string")s.Cilj="";
  if(typeof s.Rok!=="string")s.Rok="";
  if(s.Naziv==="DZO Follow up"&&s.Tip==="Redovna"){s.Naziv="Unapređenje DZO";s.Tip="Projektna";s.Rok=s.Rok||"2026-12-31";s.Cilj=s.Cilj||"Unapređenje procesa, organizacije i proizvoda DZO.";}
 });
 // Add direct series links to existing meeting items. Existing information is preserved.
 S.items.forEach(x=>{
  if(x.KolegijumID&&!x.SerijaID){
   const m=S.meetings.find(mm=>Number(mm.ID)===Number(x.KolegijumID));
   if(m?.SerijaID)x.SerijaID=Number(m.SerijaID);
  }
 });
 // Existing carried agenda items from earlier versions get an explicit historical link.
 S.items.filter(x=>x.Tip==="Beleška"&&x.AgendaStavka===true&&x.PrenesenoIzSastankaID&&x.KolegijumID).forEach(copy=>{
  const source=S.items.find(n=>n.Tip==="Beleška"&&n.AgendaStavka===true&&Number(n.KolegijumID)===Number(copy.PrenesenoIzSastankaID)&&n.Zadatak===copy.Zadatak);
  if(source&&!source.PrenesenoNaSastanakID)source.PrenesenoNaSastanakID=Number(copy.KolegijumID);
 });
 S.people=[...new Set(S.items.map(x=>x.Odgovoran).filter(Boolean))].sort();
 save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

}

function daysSince(d){
 if(!d)return 99999;
 return Math.floor((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/86400000);
}
function backupDue(){return !S._lastBackup || daysSince(S._lastBackup)>=14}
function activeActions(){return S.items.filter(x=>x.Tip==="Akcija"&&x.Status!=="Završeno")}
function legacyProjects(){return S.items.filter(x=>x.Tip==="Projekat"&&x.Status!=="Završen")}
function projectSeries(){return (S.meetingSeries||[]).filter(s=>s.Tip==="Projektna"&&s.Status!=="Završen")}
function notes(){return S.items.filter(x=>x.Tip==="Beleška")}
function projectActions(p){
 return activeActions().filter(x=>Number(x.ProjectID)===Number(p.ID));
}
function meetingById(id){return (S.meetings||[]).find(m=>Number(m.ID)===Number(id))}
function meetingItems(id){return S.items.filter(x=>Number(x.KolegijumID)===Number(id))}
function meetingActions(id){return activeActions().filter(x=>Number(x.KolegijumID)===Number(id))}
function seriesById(id){return (S.meetingSeries||[]).find(s=>Number(s.ID)===Number(id))}
function seriesMeetings(id){return (S.meetings||[]).filter(m=>Number(m.SerijaID)===Number(id))}
function seriesOpenActions(id){
 const mids=new Set(seriesMeetings(id).map(m=>Number(m.ID)));
 return activeActions().filter(x=>Number(x.SerijaID)===Number(id)||(!x.SerijaID&&mids.has(Number(x.KolegijumID))));
}
function seriesNotes(id){return notes().filter(n=>n.Status!=="Arhivirana"&&Number(n.SerijaID)===Number(id))}
function seriesNextAgenda(id){return seriesNotes(id).filter(n=>!n.KolegijumID&&n.ZaSledeciSastanak===true)}
function meetingLabel(m){
 const s=m&&m.SerijaID?seriesById(m.SerijaID):null;
 return `${s?esc(s.Naziv):esc(m?.Naslov||"Sastanak")} · ${esc(fmtDate(m?.Datum||""))}`;
}


function daysTo(d){if(!d)return 99999;return Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function greeting(){
 const h=new Date().getHours();
 return h<11?"Dobro jutro":h<18?"Dobar dan":"Dobro veče";
}
function monthShort(d){
 if(!d)return "";
 const m=["JAN","FEB","MAR","APR","MAJ","JUN","JUL","AVG","SEP","OKT","NOV","DEC"];
 const dt=new Date(d+"T00:00:00"); return m[dt.getMonth()];
}
const ICONS={
 action:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>`,
 project:`<svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.8 2h9.2v9.5a2 2 0 0 1-2 2h-15z"/><path d="M3.5 7.5V5a2 2 0 0 1 2-2h4l1.8 2h7.2a2 2 0 0 1 2 2v2.5"/></svg>`,
 note:`<svg viewBox="0 0 24 24"><path d="M6 3.5h9l3 3V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 20V5A1.5 1.5 0 0 1 6.5 3.5z"/><path d="M14.5 3.5V7h3.5M8 11h7M8 15h7"/></svg>`,
 calendar:`<svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M8 3v5M16 3v5M4 10h16"/></svg>`
};
function attentionSort(a,b){
 const score=x=>{let s=0,d=daysTo(x.Rok);if(d<0)s+=1000;if(x.Prioritet==="Strateško")s+=500;if(d>=0&&d<=7)s+=300;if(!x.Rok)s+=20;return -s};
 return score(a)-score(b);
}
function taskCard(x){
 const d=daysTo(x.Rok);
 const stripe=d<0?"var(--red)":d<=7?"var(--amber)":"#c0c8c3";
 const priClass=x.Prioritet==="Strateško"?"priority strategic":"priority";
 const project=x.ProjectID?(S.projects||[]).find(p=>Number(p.ID)===Number(x.ProjectID)):null;
 const ser=x.SerijaID?seriesById(x.SerijaID):null;
 const projectName=(project&&(project.Naziv||project.Projekat||project.Zadatak))||x.Projekat||(ser?.Tip==="Projektna"?ser.Naziv:"")||"";
 return `<div class="card tight" data-item="${x.ID}" style="border-left:4px solid ${stripe}">
  <div class="taskTitle">${esc(x.Zadatak)}</div>
  <div class="meta">
   ${x.Odgovoran?`<span class="chip person">${esc(x.Odgovoran)}</span>`:""}
   ${x.Prioritet?`<span class="chip ${priClass}">${esc(x.Prioritet)}</span>`:""}
   ${projectName?`<span class="chip">${esc(projectName)}</span>`:""}
   ${x.Rok?`<span class="chip date">${esc(fmtDate(x.Rok))}</span>`:""}
  </div>
 </div>`;
}
let route="pregled",dashboardArea="Poslovno";
const actionView={scope:"mine",area:"all",priority:"all",search:"",laterOpen:false};
let notesView="standalone";
const meetingsView={tab:"upcoming",search:""};
function render(){
 document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("on",b.dataset.nav===route));
 ({pregled:vPregled,akcije:vAkcije,projekti:vProjekti,sastanci:vSastanci,beleske:vBeleske}[route]||vPregled)();
 bindCards(); bindMenu();
}
function head(title,sub=""){
 return `<div class="top"><div><h1>${esc(title)}</h1>${sub?`<div class="sm mute">${esc(sub)}</div>`:""}</div></div>`;
}
function vPregled(){
 const actions=activeActions().filter(x=>(x.Oblast||"Poslovno")===dashboardArea&&(x.Odgovoran||"")==="Ivan");
 const ps=dashboardArea==="Poslovno"?projectSeries():[];
 const ns=notes().filter(x=>x.Status!=="Arhivirana"&&x.Status!=="Završeno"&&(x.Oblast||"Poslovno")===dashboardArea);
 const overdue=actions.filter(x=>x.Rok&&daysTo(x.Rok)<0).sort(attentionSort);
 const dueToday=actions.filter(x=>x.Rok===today());
 const strategic=actions.filter(x=>x.Prioritet==="Strateško");
 const todayRows=dueToday.slice().sort(attentionSort);
 const next7=actions.filter(x=>x.Rok&&daysTo(x.Rok)>=1&&daysTo(x.Rok)<=7).sort(attentionSort);
 const dashboardMeetings=dashboardArea==="Poslovno"?(S.meetings||[]):[];
 const overdueMeetings=dashboardMeetings.filter(m=>m.Status!=="Završen"&&m.Datum<today()).slice().sort((a,b)=>(b.Datum||"").localeCompare(a.Datum||""));
 const upcomingMeetings=dashboardMeetings.filter(m=>m.Status!=="Završen"&&m.Datum>=today()&&daysTo(m.Datum)<=7).slice().sort((a,b)=>(a.Datum||"").localeCompare(b.Datum||"")||(a.ID||0)-(b.ID||0));
 const next7HTML=next7.length?next7.map(x=>{
   const [y,m,d]=x.Rok.split("-");
   return `<div class="upcomingRow" data-item="${x.ID}">

    <button class="pendingCircle" data-done="${x.ID}" aria-label="Označi kao završeno"></button>
   </div>`;
 }).join(""):`<div class="dashboardEmpty">Nema akcija koje dospijevaju u narednih 7 dana.</div>`;

 const overdueMeetingsHTML=overdueMeetings.map(m=>{
   const ser=m.SerijaID?seriesById(m.SerijaID):null;
   return `<div class="todayRow late" data-dashboard-meeting="${m.ID}">

    <div><div class="rowTitle">${esc(ser?.Naziv||m.Naslov||"Sastanak")}</div><div class="rowMeta">Sastanak za završiti</div></div>
    <div class="rowDue">Prije ${Math.abs(daysTo(m.Datum))} d</div>
   </div>`;
 }).join("");
 const meetingsHTML=upcomingMeetings.length?upcomingMeetings.map(m=>{
   const ser=m.SerijaID?seriesById(m.SerijaID):null;
   const d=daysTo(m.Datum),due=d===0?"Danas":d===1?"Sjutra":fmtDate(m.Datum);
   const people=(m.Ucesnici||[]).length?participantText(m.Ucesnici):"Učesnici nijesu uneseni";
   return `<div class="upcomingRow" data-dashboard-meeting="${m.ID}">
    <div class="dateBox"><div class="dateDay">${(m.Datum||"").split("-")[2]||""}</div><div class="dateMonth">${monthShort(m.Datum||"")}</div></div>
    <div><div class="rowTitle">${esc(ser?.Naziv||m.Naslov||"Sastanak")}</div><div class="rowMeta">${esc(people)}</div></div>
    <div class="rowDue">${esc(due)}</div>
   </div>`;
 }).join(""):`<div class="dashboardEmpty">Nema sastanaka danas ni u narednih 7 dana.</div>`;

 const tile=(icon,title,value,foot,extra="")=>`<div class="summaryTile ${value===0?"zero":""} ${extra}">
   <div class="summaryIcon">${icon}</div><div class="summaryTitle">${title}</div>
   <div class="summaryValue">${value}</div><div class="summaryFoot">${foot}</div></div>`;

 const overdueHTML=overdue.map(x=>`<div class="todayRow late" data-item="${x.ID}">
   <button class="checkBox" data-done="${x.ID}" aria-label="Označi kao završeno"></button>
   <div><div class="rowTitle">${esc(x.Zadatak)}</div><div class="rowMeta">${esc(x.Izvor||x.Projekat||x.Sistem||"Akcija")}${x.Prioritet?` · ${esc(x.Prioritet)}`:""}</div></div>
   <div class="rowDue">Kasni ${Math.abs(daysTo(x.Rok))} d</div><span class="starMark ${x.Prioritet==="Strateško"?"strategic":""}">${x.Prioritet==="Strateško"?"★":""}</span>
  </div>`).join("");

 const todayHTML=todayRows.length?todayRows.map(x=>{
   const d=daysTo(x.Rok),cls=d<0?"late":d<=1?"soon":"";
   return `<div class="todayRow ${cls}" data-item="${x.ID}">
     <button class="checkBox" data-done="${x.ID}" aria-label="Označi kao završeno"></button>
     <div><div class="rowTitle">${esc(x.Zadatak)}</div><div class="rowMeta">${esc(x.Izvor||x.Projekat||x.Sistem||"Akcija")}${x.Prioritet?` · ${esc(x.Prioritet)}`:""}</div></div>
     <div class="rowDue">Danas</div><span class="starMark ${x.Prioritet==="Strateško"?"strategic":""}" aria-label="${x.Prioritet==="Strateško"?"Strateško":""}">${x.Prioritet==="Strateško"?"★":""}</span>
   </div>`;
 }).join(""):`<div class="dashboardEmpty">Nema akcija sa rokom danas.</div>`;
 $("#view").innerHTML=`<section class="dashboardHero">
  <div class="heroTop">
   <div class="logoPlate"><img src="https://www.grawe.at/fileadmin/shared/Logos/Logo_GRAWE_2021_RGB.jpg" alt="GRAWE"></div>
   <button class="menuCircle" id="menuBtn" aria-label="Meni">☰</button>
  </div>
  <div class="heroBody">
   <div><div class="greeting">${greeting()}, <b>Ivan</b></div><div class="heroSub">Evo šta traži pažnju danas.</div></div>
   <div class="priorityCard"><div class="priorityLabel"><span class="star">☆</span>Prioriteti</div><div class="priorityNumber">${strategic.length}</div><div class="priorityFoot">strateških</div></div>
  </div>
 </section>
 <div class="dashboardContent">
 <div class="tabs areaTabs" style="margin-top:12px"><button class="btn ${dashboardArea==="Poslovno"?"on":""}" data-area="Poslovno">Poslovno</button><button class="btn ${dashboardArea==="Privatno"?"on":""}" data-area="Privatno">Privatno</button></div>
 <div class="dashboardKpis">
  ${tile(ICONS.action,"Akcije",actions.length,"otvorenih")}
  ${tile(ICONS.project,"Projekti",ps.length,"aktivnih")}
  ${tile(ICONS.note,"Beleške",ns.length,"sačuvanih")}
  ${tile(ICONS.calendar,"Rokovi danas",dueToday.length,dueToday.length===1?"stavka":"stavki","due")}
 </div>

 ${(overdue.length||overdueMeetings.length)?`<div class="sectionHead"><h2>Kasni</h2>${overdueMeetings.length?"":`<button class="sectionLink" data-go="akcije">Prikaži sve ›</button>`}</div>
 <div class="sectionCard">${overdueHTML}${overdueMeetingsHTML}</div>`:""}

 <div class="sectionHead"><h2>Danas</h2><button class="sectionLink" data-go="akcije">Prikaži sve ›</button></div>
 <div class="sectionCard">${todayHTML}</div>

 ${dashboardArea==="Poslovno"?`<div class="sectionHead"><h2>Sastanci</h2><button class="sectionLink" data-go="sastanci">Prikaži sve ›</button></div>
 <div class="sectionCard">${meetingsHTML}</div>`:""}

 <div class="sectionHead"><h2>Dospijeva u narednih 7 dana</h2><button class="sectionLink" data-go="akcije">Prikaži sve ›</button></div>
 <div class="sectionCard">${next7HTML}</div>
 </div>`;

 $("#view").querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{dashboardArea=b.dataset.area;render()});

function actionListCard(x){
 const d=daysTo(x.Rok);
 const cls=d<0?"late":d<=7?"soon":x.Prioritet==="Strateško"?"strategic":"";
 const due=x.Rok?(d<0?`Kasni ${Math.abs(d)} d`:d===0?"Danas":fmtDate(x.Rok)):"Bez roka";
 const dueCls=d<0?"late":d<=7?"soon":"";
 const meeting=x.KolegijumID?meetingById(x.KolegijumID):null;
 const meetingMeta=meeting?(meeting.SerijaID&&seriesById(meeting.SerijaID)?`${seriesById(meeting.SerijaID).Naziv} · ${fmtDate(meeting.Datum)}`:`Sastanak · ${fmtDate(meeting.Datum)}`):"";
 const directSeries=x.SerijaID?seriesById(x.SerijaID):null;
 const seriesMeta=!meeting&&directSeries?directSeries.Naziv:"";
 const meta=[x.Oblast==="Privatno"?"Privatno":"",x.Odgovoran,x.Projekat,seriesMeta,meetingMeta].filter(Boolean).map(esc).join(" · ");
 return `<div class="card secondaryCard ${cls}" data-item="${x.ID}">
  <div class="secondaryTop"><div class="taskTitle grow">${esc(x.Zadatak)}</div><div class="secondaryDue ${dueCls}">${esc(due)}</div></div>
  ${meta?`<div class="secondaryMeta">${meta}</div>`:""}
  ${x.Prioritet==="Strateško"?`<div class="meta"><span class="chip priority strategic">Strateško</span></div>`:""}
 </div>`;
}
function vAkcije(){
 const all=()=>activeActions().slice().sort(attentionSort);
 const scopedAll=()=>{
  const arr=all();
  if(actionView.scope==="mine")return arr.filter(x=>(x.Odgovoran||"")==="Ivan");
  if(actionView.scope==="followup")return arr.filter(x=>(x.Odgovoran||"")!=="Ivan");
  return arr;
 };
 const isFiltered=()=>actionView.scope!=="mine"||actionView.area!=="all"||actionView.priority!=="all"||!!actionView.search;
 const baseFiltered=()=>{
  let arr=scopedAll();
  if(actionView.area!=="all")arr=arr.filter(x=>(x.Oblast||"Poslovno")===actionView.area);
  if(actionView.priority!=="all")arr=arr.filter(x=>x.Prioritet===actionView.priority);
  if(actionView.search){
   const q=actionView.search.toLocaleLowerCase();
   arr=arr.filter(x=>{
    const m=x.KolegijumID?meetingById(x.KolegijumID):null;
    const ser=x.SerijaID?seriesById(x.SerijaID):(m?.SerijaID?seriesById(m.SerijaID):null);
    return [x.Zadatak,x.Odgovoran,x.Projekat,x.Izvor,m?fmtDate(m.Datum||""):"",m?.Naslov,m?.Napomena,ser?.Naziv,x["Detalj izvora"],x["Detalji dogovora"]].filter(Boolean).join(" ").toLocaleLowerCase().includes(q);
   });
  }
  return arr;
 };
 const groups=arr=>({
  late:arr.filter(x=>daysTo(x.Rok)<0),
  today:arr.filter(x=>x.Rok===today()),
  week:arr.filter(x=>daysTo(x.Rok)>=1&&daysTo(x.Rok)<=7),
  later:arr.filter(x=>daysTo(x.Rok)>7)
 });
 const section=(title,arr,key,collapsed=false)=>{
  if(!arr.length)return "";
  const open=key!=="later"||actionView.laterOpen||isFiltered();
  const body=collapsed&&!open?"":`<div class="list actionGroupList">${arr.map(actionListCard).join("")}</div>`;
  return `<section class="actionGroup"><button class="actionGroupHead" ${key==="later"?'id="toggleLater"':""}>
   <span>${title}</span><span class="actionGroupCount">${arr.length}${key==="later"?` ${open?"⌃":"⌄"}`:""}</span>
   </button>${body}</section>`;
 };
 const draw=()=>{
  const arr=baseFiltered(),g=groups(arr);
  const scopeLabel=actionView.scope==="mine"?"mojih":actionView.scope==="followup"?"za follow-up":"ukupno";
  $("#actionCount").textContent=`${arr.length} ${scopeLabel} otvorenih akcija`;
  $("#tasks").innerHTML=section("Kasni",g.late,"late")+section("Danas",g.today,"today")+section("Dospijeva u narednih 7 dana",g.week,"week")+section("Kasnije",g.later,"later",true)||`<div class="empty">Nema akcija u ovom prikazu.</div>`;
  bindCards();
  if($("#toggleLater"))$("#toggleLater").onclick=()=>{actionView.laterOpen=!actionView.laterOpen;draw()};
 };
 $("#view").innerHTML=head("Akcije")+`
 <div class="sm mute" id="actionCount"></div>
 <div class="sm mute filterLabel">Prikaz</div><div class="tabs filterScroll" id="scopeFilters">
  ${[["mine","Moje"],["followup","Follow-up"],["all","Sve"]].map(([v,l])=>`<button class="btn ${actionView.scope===v?"on":""}" data-scope-filter="${v}">${l}</button>`).join("")}</div>
 <label class="actionSearch"><span aria-hidden="true">⌕</span><input id="actionSearch" type="search" placeholder="Pretraži akcije" value="${esc(actionView.search)}"></label>
 <div class="sm mute filterLabel">Oblast</div><div class="tabs filterScroll" id="areaFilters">
  ${[["all","Sve"],["Poslovno","Poslovno"],["Privatno","Privatno"]].map(([v,l])=>`<button class="btn ${actionView.area===v?"on":""}" data-area-filter="${v}">${l}</button>`).join("")}</div>
 <div class="sm mute filterLabel">Prioritet</div><div class="tabs filterScroll" id="priorityFilters">
  ${[["all","Sve"],["Strateško","Strateško"]].map(([v,l])=>`<button class="btn ${actionView.priority===v?"on":""}" data-priority-filter="${v}">${l}</button>`).join("")}</div>
 <div id="tasks" style="margin-top:14px"></div>`;
 draw();
 $("#actionSearch").oninput=e=>{actionView.search=e.target.value.trim();draw()};
 $("#view").querySelectorAll("[data-scope-filter]").forEach(b=>b.onclick=()=>{actionView.scope=b.dataset.scopeFilter;vAkcije()});
 $("#view").querySelectorAll("[data-area-filter]").forEach(b=>b.onclick=()=>{actionView.area=b.dataset.areaFilter;vAkcije()});
 $("#view").querySelectorAll("[data-priority-filter]").forEach(b=>b.onclick=()=>{actionView.priority=b.dataset.priorityFilter;vAkcije()});

function vBeleske(){

 const standalone=ns.filter(n=>!n.KolegijumID).slice().sort((a,b)=>(b.ID||0)-(a.ID||0));
 const meetingNotes=ns.filter(n=>n.KolegijumID);
 const groups=[...new Set(meetingNotes.map(n=>Number(n.KolegijumID)).filter(Boolean))].map(id=>{
  const m=meetingById(id);
  const items=meetingNotes.filter(n=>Number(n.KolegijumID)===id).slice().sort((a,b)=>(a.ID||0)-(b.ID||0));
  const agendaCount=items.filter(n=>n.AgendaStavka).length,noteCount=items.filter(n=>!n.AgendaStavka).length;
  return {id,m,items,agendaCount,noteCount,lastId:Math.max(...items.map(n=>Number(n.ID)||0))};
 }).sort((a,b)=>b.lastId-a.lastId);

function vSastanci(){

 };

  const status=m.Status==="Završen"?"Završen":(m.Datum<today()?"Za završiti":"");

function minutesPlainText(d,extras={},generatedAt=minutesGeneratedAt()){
 const sec=(name,rows)=>rows.length?`\n\n${name}\n${rows.join("\n")}`:"";
 const actionById=id=>d.actions.find(x=>Number(x.id)===Number(id));
 const projectById=id=>d.projects.find(x=>Number(x.id)===Number(id));
 let out=d.title||"Zapisnik";
 if(d.subtitle)out+=`\n${d.subtitle}`;
 out+=`\nDatum: ${d.date||"—"}\nUčesnici: ${d.participants||"—"}`;
 if(extras.intro)out+=`\n\nUVOD / KONTEKST\n${extras.intro}`;
 if(d.previousMeeting){
  out+=sec(`REALIZACIJA PRETHODNOG SASTANKA — ${d.previousMeeting.date}`,d.previousMeeting.actions.map(x=>`• ${x.title} — ${x.status}${x.owner?` — ${x.owner}`:""}${x.due?` — rok ${x.due}`:""}`));
 }
 out+=sec("AGENDA",d.agenda.map(a=>`${a.no}. ${a.title}`));
 out+=sec("ZAKLJUČCI PO TAČKAMA",d.agenda.map(a=>{
  const lines=[`${a.no}. ${a.title}`];
  if(a.conclusion)lines.push(`Zaključak: ${a.conclusion}`);
  else lines.push("Zaključak: —");
  a.actions.map(actionById).filter(Boolean).forEach(x=>lines.push(`Akcija: ${x.title}${x.owner?` — ${x.owner}`:""}${x.due?` — rok ${x.due}`:""}${x.detail?`\n   ${x.detail}`:""}`));
  a.projects.map(projectById).filter(Boolean).forEach(x=>lines.push(`Projekat: ${x.title}${x.due?` — rok ${x.due}`:""}${x.detail?`\n   ${x.detail}`:""}`));
  if(a.transferredTo)lines.push(`Preneseno na sljedeći termin: ${a.transferredTo}`);
  else if(a.carry)lines.push("Prenos na sljedeći termin");
  else if(!a.conclusion&&!a.actions.length&&!a.projects.length&&a.carryDecision==="Ne prenosi")lines.push("Bez ishoda · nije preneseno");
  return lines.join("\n   ");
 }));
 out+=sec("BELEŠKE — INFORMATIVNO",d.notes.map(x=>`• ${x.title}${x.detail?`\n   ${x.detail}`:""}`));
 const unlinkedProjects=d.projects.filter(x=>!x.agendaId);
 out+=sec("PROJEKTI VAN AGENDE",unlinkedProjects.map(x=>`• ${x.title}${x.due?` — rok ${x.due}`:""}${x.detail?`\n   ${x.detail}`:""}`));
 const unlinkedActions=d.actions.filter(x=>!x.agendaId);
 out+=sec("OSTALE AKCIJE",unlinkedActions.map(x=>`• ${x.title}${x.owner?` — ${x.owner}`:""}${x.due?` — rok ${x.due}`:""} — ${x.status}${x.detail?`\n   ${x.detail}`:""}`));
 if(extras.closing)out+=`\n\nZAVRŠNA NAPOMENA\n${extras.closing}`;
 out+=`\n\nGenerisano: ${generatedAt}`;
 return out;
}

const dialogNavStack=[];
let dialogNavCurrent=null,dialogNavSeq=0;

function navFrameValid(frame){
 if(!frame||!frame.key)return false;
 const [kind,raw]=String(frame.key).split(":");
 const id=Number(raw);
 if(kind==="meeting"||kind==="minutes"||kind==="meetingNote"||kind==="meetingNotes"||kind==="agendaForm"||kind==="finishMeeting")return !!meetingById(id);
 if(kind==="series")return !!seriesById(id);
 if(kind==="item")return !!S.items.find(x=>Number(x.ID)===id);
 if(kind==="note")return !!S.items.find(x=>Number(x.ID)===id&&x.Tip==="Beleška"&&x.Status!=="Arhivirana");
 if(kind==="project")return !!S.items.find(x=>Number(x.ID)===id&&x.Tip==="Projekat");
 if(kind==="deadline"||kind==="owner"||kind==="agendaOutcome")return !!S.items.find(x=>Number(x.ID)===id);
 if(kind==="meetingForm")return raw==="new"||!!meetingById(id);
 if(kind==="itemForm")return raw==="new"||!!S.items.find(x=>Number(x.ID)===id);
 if(kind==="seriesForm")return raw==="new"||!!seriesById(id);
 return true;
}
function navFindFrame(key){
 if(dialogNavCurrent?.key===key)return -2;
 for(let i=dialogNavStack.length-1;i>=0;i--)if(dialogNavStack[i].key===key)return i;
 return -1;
}
function navTakeCurrentNodes(){
 const body=$("#dlgBody"),nodes=[];
 if(!body)return nodes;
 while(body.firstChild)nodes.push(body.removeChild(body.firstChild));
 return nodes;
}
function navRestoreFrame(frame){
 const body=$("#dlgBody");if(!body)return;
 body.innerHTML="";
 (frame.nodes||[]).forEach(n=>body.appendChild(n));
 body.scrollTop=frame.scrollTop||0;
 frame.nodes=null;
 dialogNavCurrent=frame;
 const d=$("#dlg");if(d&&!d.open)d.showModal();
}
function navOpen(html,key=null,options={}){
 const body=$("#dlgBody"),d=$("#dlg");if(!body||!d)return;
 key=key||`anon:${++dialogNavSeq}`;
 const dedupe=options.dedupe!==false;
 const found=dedupe?navFindFrame(key):-1;
 if(found===-2){
  body.innerHTML=html;
  dialogNavCurrent.refresh=options.refresh||dialogNavCurrent.refresh||null;
  dialogNavCurrent.onResume=options.onResume||dialogNavCurrent.onResume||null;
  if(!d.open)d.showModal();
  return;
 }
 if(found>=0){
  const picked=dialogNavStack[found];
  dialogNavStack.splice(found);
  body.innerHTML=html;
  dialogNavCurrent={...picked,nodes:null,scrollTop:0,refresh:options.refresh||picked.refresh||null,onResume:options.onResume||picked.onResume||null};
  if(!d.open)d.showModal();
  return;
 }
 if(dialogNavCurrent){
  dialogNavCurrent.nodes=navTakeCurrentNodes();
  dialogNavCurrent.scrollTop=body.scrollTop||0;
  dialogNavStack.push(dialogNavCurrent);
 }
 body.innerHTML=html;
 dialogNavCurrent={key,refresh:options.refresh||null,onResume:options.onResume||null,nodes:null,scrollTop:0};
 if(!d.open)d.showModal();
}
function navReplace(html,key=null,options={}){
 const body=$("#dlgBody"),d=$("#dlg");if(!body||!d)return;
 body.innerHTML=html;
 dialogNavCurrent={key:key||dialogNavCurrent?.key||`anon:${++dialogNavSeq}`,refresh:options.refresh||dialogNavCurrent?.refresh||null,onResume:options.onResume||dialogNavCurrent?.onResume||null,nodes:null,scrollTop:0};
 if(!d.open)d.showModal();
}
function navBack(result=null){
 const body=$("#dlgBody"),d=$("#dlg");
 dialogNavCurrent=null;
 while(dialogNavStack.length){
  const frame=dialogNavStack.pop();
  if(!navFrameValid(frame))continue;
  navRestoreFrame(frame);
  const current=dialogNavCurrent;
  if(current.onResume)current.onResume(result);
  if(dialogNavCurrent===current&&result&&["saved","changed","deleted"].includes(result.type)&&current.refresh)current.refresh(result);
  return true;
 }
 if(body)body.innerHTML="";
 if(d?.open)d.close();
 return false;
}

 <div class="btnrow" style="margin-top:18px"><button class="btn grow" id="noteEdit">Uredi</button>${isAgenda?`<button class="btn pri grow" id="noteOutcome">Zaključak / prenos</button>`:""}<button class="btn pri grow" id="noteConvert">→ Akcija</button><button class="btn grow" id="noteConvertProject">→ Projekat</button></div>
 <div class="btnrow" style="margin-top:8px"><button class="btn grow" id="noteShare">Podijeli</button><button class="btn grow" id="noteArchive">Arhiviraj</button><button class="btn danger grow" id="noteDelete">Obriši</button></div>`,

 $("#noteConvertProject").onclick=()=>editSeries(null,false,{Tip:"Projektna",Naziv:n.Zadatak});

function projectDialog(id){
 const p=S.items.find(x=>x.ID===id&&x.Tip==="Projekat");if(!p){navBack();return}
 const name=p.Projekat||p.Zadatak,a=projectActions(p).slice().sort(attentionSort);
 const groups={late:a.filter(x=>daysTo(x.Rok)<0),today:a.filter(x=>x.Rok===today()),week:a.filter(x=>daysTo(x.Rok)>=1&&daysTo(x.Rok)<=7),later:a.filter(x=>daysTo(x.Rok)>7)};
 const group=(title,arr)=>arr.length?`<div class="projectActionGroup"><div class="projectActionHead"><span>${title}</span><span>${arr.length}</span></div><div class="list">${arr.map(taskCard).join("")}</div></div>`:"";
 navOpen(`<div class="row between"><h2>${esc(name)}</h2><button class="btn" id="pc">×</button></div>
 <div class="meta" style="margin:8px 0 10px">${p.Rok?`<span class="chip date">${daysTo(p.Rok)<0?`Kasni ${Math.abs(daysTo(p.Rok))} d`:`Rok ${esc(fmtDate(p.Rok))}`}</span>`:""}${p.Sistem?`<span class="chip">${esc(p.Sistem)}</span>`:""}${p.KolegijumID?`<span class="chip">${meetingById(p.KolegijumID)?.SerijaID&&seriesById(meetingById(p.KolegijumID).SerijaID)?`${esc(seriesById(meetingById(p.KolegijumID).SerijaID).Naziv)} · ${esc(fmtDate(meetingById(p.KolegijumID).Datum))}`:`Sastanak · ${esc(fmtDate(meetingById(p.KolegijumID)?.Datum||""))}`}</span>`:""}</div>
 ${p["Detalji dogovora"]?`<div class="sm mute" style="margin:8px 0 14px">${esc(p["Detalji dogovora"])}</div>`:""}${deadlineHistoryHTML(p)}
 <div class="row between projectActionsTitle"><div><b>Akcije projekta</b><div class="sm mute">${a.length} otvorenih</div></div><button class="btn pri" id="pa">+ Nova akcija</button></div>
 <div class="projectActionsWrap">${group("Kasni",groups.late)}${group("Danas",groups.today)}${group("Dospijeva u narednih 7 dana",groups.week)}${group("Kasnije",groups.later)}${!a.length?`<div class="empty">Još nema otvorenih akcija u projektu.</div>`:""}</div>
 <div class="btnrow" style="margin-top:18px"><button class="btn grow" id="pe">Uredi projekat</button><button class="btn grow" id="pshare">Podijeli</button><button class="btn grow" id="pmove">Pomjeri rok</button><button class="btn grow" id="pf">Završi projekat</button></div>`,
 `project:${id}`,{refresh:()=>projectDialog(id)});
 $("#pc").onclick=navBack;$("#pa").onclick=()=>editItem(null,"Akcija",{Projekat:name,ProjectID:p.ID,Oblast:"Poslovno"});$("#pe").onclick=()=>editItem(p,"Projekat");
 $("#pshare").onclick=()=>shareText("Projekat",itemShareText(p));$("#pmove").onclick=()=>moveDeadlineDialog(p.ID);
 $("#pf").onclick=()=>{const open=projectActions(p);if(open.length){alert(`Projekat ima ${open.length} otvoren${open.length===1?"u akciju":"ih akcija"}. Prvo ih završi.`);return}if(confirm(`Završi projekat "${name}"?`)){p.Status="Završen";save();render();navBack({type:"changed",kind:"Projekat",id:p.ID})}};
 bindCards($("#dlgBody"));

 const late=a.filter(x=>daysTo(x.Rok)<0),todayA=a.filter(x=>x.Rok===today()),week=a.filter(x=>daysTo(x.Rok)>=1&&daysTo(x.Rok)<=7),later=a.filter(x=>daysTo(x.Rok)>7);
 const group=(title,arr)=>arr.length?`<div class="personActionGroup"><div class="projectActionHead"><span>${title}</span><span>${arr.length}</span></div><div class="list">${arr.map(taskCard).join("")}</div></div>`:"";
 navOpen(`<div class="row between"><div><h2>${esc(name)}</h2><div class="sm mute">${a.length} otvorenih akcija${a.length===0?` · Nema otvorenih akcija`:""}</div></div><button class="btn" id="oc">×</button></div>
 <button class="btn pri" id="oa" style="margin-top:12px">+ Nova akcija</button><div style="margin-top:12px">${group("Kasni",late)}${group("Danas",todayA)}${group("Dospijeva u narednih 7 dana",week)}${group("Kasnije",later)}${!a.length?`<div class="empty">Nema otvorenih akcija.</div>`:""}</div>`,

function noteArchiveDialog(id){

 navOpen(`<div class="row between"><h2>Arhivirana beleška</h2><button class="btn" id="nac">×</button></div>
 <div class="noteFull">${esc(n.Zadatak)}</div><div class="meta" style="margin-top:10px"><span class="chip">${esc(n.Oblast||"Poslovno")}</span></div>
 <div class="btnrow" style="margin-top:18px"><button class="btn grow" id="noteRestore">Vrati u Beleške</button><button class="btn danger grow" id="noteDeleteArchived">Obriši</button></div>`,`noteArchive:${id}`,{dedupe:false});

function projectArchiveDialog(id){
 const p=S.items.find(x=>x.Tip==="Projekat"&&Number(x.ID)===Number(id));if(!p)return;
 const acts=S.items.filter(x=>x.Tip==="Akcija"&&Number(x.ProjectID)===Number(p.ID));

 const projectsA=S.items.filter(x=>x.Tip==="Projekat"&&x.Status==="Završen").slice().sort((a,b)=>(b.ID||0)-(a.ID||0));

 const total=actions.length+projectsA.length+notesA.length;
 navOpen(`<div class="row between"><div><h2>Arhiva</h2><div class="sm mute">${total} arhiviranih stavki</div></div><button class="btn" id="ac">×</button></div>

 ${notesA.length?`<div class="archiveSection"><div class="projectActionHead"><span>Beleške</span><span>${notesA.length}</span></div><div class="list">${notesA.map(n=>`<div class="card tight" data-arch-note="${n.ID}"><b>${esc(n.Zadatak)}</b><div class="sm mute" style="margin-top:4px">${esc(n.Oblast||"Poslovno")}</div></div>`).join("")}</div></div>`:""}

function exportData(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="obaveze-backup-"+today()+".json";a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);openDlg(`<h2>Backup pokrenut</h2><p class="mute" style="margin:10px 0 16px">Ako je fajl uspješno sačuvan na uređaju, potvrdi ispod. Tek tada će se računati novi rok od 14 dana.</p><div class="btnrow"><button class="btn pri grow" id="backupOk">Fajl je sačuvan</button><button class="btn grow" id="backupNo">Nije sačuvan</button></div>`);$("#backupOk").onclick=()=>{S._lastBackup=today();save();closeDlg()};$("#backupNo").onclick=closeDlg},300);
}
function importData(){
 const input=document.createElement("input");input.type="file";input.accept="application/json,.json";
 input.onchange=()=>{
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
   try{
    const data=JSON.parse(String(r.result||""));
    if(!data||!Array.isArray(data.items))throw new Error("format");
    openDlg(`<h2>Vrati backup?</h2><p class="mute" style="margin:10px 0 16px">Trenutni lokalni podaci biće zamijenjeni sadržajem iz <b>${esc(f.name)}</b>.</p><div class="btnrow"><button class="btn danger grow" id="importYes">Vrati backup</button><button class="btn grow" id="importNo">Otkaži</button></div>`);
    $("#importNo").onclick=closeDlg;
    $("#importYes").onclick=()=>{S=data;S.lastId=Number(S.lastId)||0;norm();closeDlg();render()};
   }catch(e){openDlg(`<h2>Backup nije učitan</h2><p class="mute" style="margin:10px 0 16px">Izabrani fajl nije prepoznat kao važeći backup aplikacije Obaveze.</p><button class="btn pri" style="width:100%" id="importErrClose">Zatvori</button>`);$("#importErrClose").onclick=closeDlg}
  };
  r.readAsText(f);
 };
 input.click();
}
function resetData(){
 openDlg(`<h2>Resetuj sve podatke?</h2><p class="mute" style="margin:10px 0 16px">Ovo trajno briše sve lokalne projekte, akcije, beleške, kolegijume i ostale podatke ove aplikacije na ovom uređaju.</p><div class="btnrow"><button class="btn danger grow" id="resetYes">Obriši sve</button><button class="btn grow" id="resetNo">Otkaži</button></div>`);

 $("#resetYes").onclick=()=>{localStorage.removeItem(KEY);S={items:[],people:[],meetings:[],meetingSeries:[],lastId:0,lastMeetingId:0,lastSeriesId:0};save();closeDlg();render()};
}
function bindCards(root=document){

}
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js?v=20260831-32").then(reg=>{
   reg.update();
   let refreshing=false;
   navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
   });
  }).catch(()=>{});
 });
}
if(isStandalone()){

}else{
